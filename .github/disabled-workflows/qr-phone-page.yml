name: QR telefonos űrlap közzététele

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qr-phone-page
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Forrás letöltése
        uses: actions/checkout@v4

      - name: Telefonos űrlap előkészítése
        run: |
          mkdir -p site
          cp web/public/provision.html site/provision.html
          touch site/.nojekyll

      - name: GitHub Pages beállítása
        uses: actions/configure-pages@v5

      - name: Oldal feltöltése
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Közzététel
        id: deployment
        uses: actions/deploy-pages@v4
