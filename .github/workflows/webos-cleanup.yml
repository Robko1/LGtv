name: Tisztítás

# Kézi indítás. Az Actions-előzményekben az utolsó 5 sikeres IPK-build marad meg.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Utolsó 5 sikeres IPK-build megtartása
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Actions-futások takarítása
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current_id = int(os.environ["CURRENT_RUN_ID"])
          base = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def api(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw) if raw else {}

          def runs(url):
              result, page = [], 1
              while True:
                  data = api(f"{url}?per_page=100&page={page}")
                  batch = data.get("workflow_runs", [])
                  result.extend(batch)
                  if len(batch) < 100:
                      return result
                  page += 1

          builds = runs(f"{base}/actions/workflows/webos-build.yml/runs")
          builds = [r for r in builds if r.get("status") == "completed" and r.get("conclusion") == "success"]
          builds.sort(key=lambda r: r.get("created_at", ""), reverse=True)
          keep = {int(r["id"]) for r in builds[:5]}
          print(f"Az utolsó {len(keep)} sikeres IPK-build megtartása.")

          removed = 0
          for run in runs(f"{base}/actions/runs"):
              rid = int(run["id"])
              if rid == current_id or rid in keep:
                  continue
              try:
                  api(f"{base}/actions/runs/{rid}", method="DELETE")
                  removed += 1
                  print(f"Törölve: {rid} — {run.get('name')} — {run.get('conclusion') or run.get('status')}")
              except Exception as exc:
                  print(f"Nem sikerült törölni a(z) {rid} futást: {exc}")

          print(f"Kész. Törölt futások: {removed}. A tisztító saját futása kimarad.")
          PY
