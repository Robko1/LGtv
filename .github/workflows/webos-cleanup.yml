name: Tisztítás

# Kizárólag kézzel indítható. Az utolsó 5 sikeres IPK-build marad; a többi befejezett IPK-build és régi diagnosztika törlődik.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Régi sikeres diagnosztikák és IPK build-ek megtartása
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Futások takarítása
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace")
                  raise RuntimeError(f"GitHub API {method} {url} -> {exc.code}: {detail}") from exc

          def all_runs(workflow):
              runs = []
              page = 1
              while True:
                  data = request(f"{api}/actions/workflows/{workflow}/runs?per_page=100&page={page}")
                  batch = data.get("workflow_runs", [])
                  runs.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return runs

          def all_repository_runs():
              runs = []
              page = 1
              while True:
                  data = request(f"{api}/actions/runs?per_page=100&page={page}")
                  batch = data.get("workflow_runs", [])
                  runs.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return runs
          policies = [
              ("webos-build.yml", 5, "sikeres IPK build"),
          ]
          deleted = 0
          kept_summary = []

          for workflow, keep_successes, label in policies:
              runs = all_runs(workflow)
              completed = [r for r in runs if r.get("status") == "completed"]
              completed.sort(key=lambda r: r.get("created_at", ""), reverse=True)
              successes = [r for r in completed if r.get("conclusion") == "success"]
              keep_ids = {r["id"] for r in successes[:keep_successes]}
              kept_summary.append(f"{label}: {len(keep_ids)} megtartva")

              for run in completed:
                  if run["id"] in keep_ids:
                      continue
                  request(f"{api}/actions/runs/{run['id']}", method="DELETE")
                  deleted += 1
                  print(f"Törölve: {workflow} / run {run['id']} ({run.get('conclusion')})")

              print(f"{workflow}: {len(completed)} befejezett futásból {len(keep_ids)} sikeres maradt.")

          # A külön diagnosztikai workflow megszűnt: régi befejezett futásait is töröljük.
          for run in all_repository_runs():
              if run.get("path") == ".github/workflows/webos-manual-diagnosis.yml" and run.get("status") == "completed":
                  request(f"{api}/actions/runs/{run.get('id')}", method="DELETE")
                  deleted += 1
                  print(f"Törölve: régi diagnosztika / run {run.get('id')} ({run.get('conclusion')})")

          print("Összegzés: " + "; ".join(kept_summary))
          print(f"Eltávolított régi/sikertelen futások: {deleted}")
          print("A Release/IPK-fájlok nem változnak; csak Actions-futások és azok artifactjai törlődnek.")
          PY
