name: IPK építés

# Kizárólag LG webOS TV IPK build; minden forrás a jelenlegi repóból származik.
# Kézi indítás (workflow_dispatch), automatikus futás nincs.
# Kimenet: az aktuális verziójú Release-ben kizárólag az IPTV-RT.ipk marad.
# A teljes forrásdiagnosztika és IPK-ellenőrzés ebben a workflow-ban fut.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-webos-build
  cancel-in-progress: false

env:
  VERSION: '2.4.8'
  IPK_FILE_NAME: 'IPTV-RT.ipk'
  RELEASE_TAG: 'v2.4.8'
  OLD_RELEASE_TAG: 'v2.3.19'
  RELEASE_TITLE: 'IPTV-RT'

jobs:
  webos-epites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 1. Forrás letöltése (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2. Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: 3. Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 4. Kézi diagnosztika – szükséges forrásfájlok
        shell: bash
        run: |
          set -euo pipefail
          test -s web/package.json
          test -s web/index.html
          test -s webos/appinfo.json
          test -s webos/webos.js
          echo "OK: a szükséges web és webOS fájlok megvannak."

      - name: 5. Függőségek telepítése
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --prefix web --no-audit --no-fund
          pip install Pillow --break-system-packages -q || pip install Pillow -q
          # Az új LG IPTV ikon minden buildnél a repó ikonkep.png fájljából készül.
          python3 - << 'PY'
          from pathlib import Path
          from PIL import Image
          source = Path("ikonkep.png")
          if not source.is_file() or source.stat().st_size == 0:
              raise SystemExit("HIBA: a gyökérben lévő ikonkep.png hiányzik vagy üres.")
          img = Image.open(source).convert("RGBA")
          Path("webos/assets").mkdir(parents=True, exist_ok=True)
          Path("web/public").mkdir(parents=True, exist_ok=True)
          # Új fájlnév: a webOS indító a régi icon.png nevet gyorsítótárazta.
          img.resize((80,80), Image.Resampling.LANCZOS).save("webos/icon-rt2.png", "PNG")
          img.resize((130,130), Image.Resampling.LANCZOS).save("webos/largeIcon-rt2.png", "PNG")
          img.resize((512,512), Image.Resampling.LANCZOS).save("webos/assets/icon_tv.png", "PNG")
          img.save("web/public/ikonkep.png", "PNG")
          # A Rendszer panel ikonja beágyazott data URI lesz, nem külső fájlhivatkozás.
          import base64, io
          def icon_b64(px):
              thumb = img.resize((px,px), Image.Resampling.LANCZOS)
              buffer = io.BytesIO()
              thumb.save(buffer, format="PNG", optimize=True)
              return base64.b64encode(buffer.getvalue()).decode("ascii")
          Path("web/src/generatedIcon.ts").write_text(
              '// BEÉGETETT alkalmazás-ikon (a repó ikonkep.png fájljából).\n'
              '// Nem külső hivatkozás: a csomagolt egyfájlos HTML-ben is mindig megjelenik.\n'
              '// A build (tools/build-webos.sh és a workflow) ugyanígy újragenerálja.\n'
              'export const APP_ICON_DATA_URL = "data:image/png;base64,' + icon_b64(128) + '";\n'
              '// Kis (32px) változat a csatornasorokhoz/kereső felugrókhoz.\n'
              'export const APP_ICON_SMALL_DATA_URL = "data:image/png;base64,' + icon_b64(32) + '";\n',
              encoding="utf-8"
          )
          print("OK: az ikon átméretezve és beégethető data URI-ként előállítva.")
          PY

      - name: 6. Kézi diagnosztika – forrás, webOS frissítő és csomagoló
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://api.github.com/repos/Robko1/LGtv/releases/latest' web/src/services/webosUpdateService.ts
          grep -Fq 'normalizeKey' webos/webos.js
          grep -Fq 'focusSpatially' webos/webos.js
          grep -Fq 'KEYCODE_TO_KEY' webos/webos.js
          grep -Fq 'makeKeyEvent' webos/webos.js
          # ES5 szintaxis őrzés: régebbi LG webOS (Chrome 38-53) elhasal a modern szintaxison
          if grep -nE '=>|`|catch \{|catch\{|^[[:space:]]*(let|const) |[;{(=] ?(let|const) ' webos/webos.js; then
            echo "HIBA: modern JS szintaxis került a webos.js-be - régebbi LG TV-ken a távirányító-kezelő nem töltődne be." >&2
            exit 1
          fi
          if grep -RniE 'IPTVNative|Android|WebView|\.apk' web/src web/index.html; then
            echo "HIBA: más platformra utaló kód maradt a webOS forrásban." >&2
            exit 1
          fi
          # Az induló videó helye: webos/assets/intro.mp4 (ezt csomagolja a build).
          # Bármilyen MÁS videófájl az assetek között viszont hiba.
          if find webos/assets -type f | grep -Ei '\.(mp4|webm|mov)$' | grep -v '/intro\.mp4$'; then
            echo "HIBA: a bejelentkező videón (assets/intro.mp4) kívül más videó van a webOS assetek között." >&2
            exit 1
          fi
          test -s webos/assets/intro.mp4
          test -s webos/assets/intro-poster.jpg
          bash -n tools/build-webos.sh
          node --check webos/webos.js
          python3 -m py_compile webos/tools/build-ipk.py
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          manifest = json.loads(Path("webos/appinfo.json").read_text(encoding="utf-8"))
          version_source = Path("web/src/appVersion.ts").read_text(encoding="utf-8")
          match = re.search(r"WEB_VERSION\s*=\s*'([^']+)'", version_source)
          if not match:
              raise SystemExit("WEB_VERSION nem található")
          if manifest.get("version") != match.group(1):
              raise SystemExit(f"Verzióeltérés: appinfo.json={manifest.get('version')} / WEB_VERSION={match.group(1)}")
          if match.group(1) != "2.4.8":
              raise SystemExit(f"Eltérő buildverzió: várt 2.4.8, kapott {match.group(1)}")
          # A TV saját indítóképernyője a VIDEÓ ELSŐ KOCKÁJA (a fehér villanás
          # ellen), és a rendszer forgó fogaskereke se jelenjen meg a videó előtt.
          if manifest.get("splashBackground") != "splash-screen.png":
              raise SystemExit("HIBA: a webOS manifest nem a splash-screen.png indítóképet használja.")
          if manifest.get("spinnerOnLaunch") is not False:
              raise SystemExit("HIBA: a webOS manifest-ben a spinnerOnLaunch nincs kikapcsolva.")
          from PIL import Image, ImageStat
          splash_png = Path("webos/splash-screen.png")
          if not splash_png.is_file():
              raise SystemExit("HIBA: hiányzik a webos/splash-screen.png indítókép.")
          splash_img = Image.open(splash_png).convert("RGB")
          if splash_img.size != (1920, 1080):
              raise SystemExit(f"HIBA: az indítókép mérete {splash_img.size}, várt 1920x1080.")
          mean = ImageStat.Stat(splash_img).mean
          if all(channel > 250 for channel in mean):
              raise SystemExit("HIBA: az indítókép tiszta fehér - ez fehér villanást okozna.")
          poster = Path("webos/assets/intro-poster.jpg")
          if not poster.is_file():
              raise SystemExit("HIBA: hiányzik a webos/assets/intro-poster.jpg (a videó első kockája).")
          print(f"LG webOS verziók egyeznek: {match.group(1)}; indítókép = a videó első kockája, spinner nélkül.")
          PY
          echo "OK: webOS-frissítő, platformtisztaság, shell szintaxis, IPK-csomagoló és verziók ellenőrizve."

      - name: 7. Webes felület fordítása webOS-re
        working-directory: web
        env:
          VITE_WEBOS: 'true'
          VITE_WEBOS_FAST_LOAD: 'true'
          VITE_WEBOS_SMALL_PLAYER: 'true'
        run: npm run build

      - name: 8. Kézi diagnosztika – HTML és webOS konfiguráció
        shell: bash
        run: |
          set -euo pipefail
          FILE=build/web/index.html
          test -s "$FILE"
          python3 -m json.tool webos/appinfo.json >/dev/null
          grep -Fq 'id="root"' "$FILE"
          test -s webos/webos.js
          echo "HTML méret: $(wc -c < "$FILE") byte"
          echo "OK: a HTML build és az appinfo.json ellenőrzése sikeres."

      - name: 9. webOS IPK építése
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/build-webos.sh webos/tools/build-ipk.py
          # Az induló (bejelentkező) videó a repó gyökeréből kerül a csomagba
          # assets/intro.mp4 néven (lásd tools/build-webos.sh).
          VERSION="$VERSION" bash tools/build-webos.sh
          ls -lh webos/*.ipk
          test -s "webos/$IPK_FILE_NAME"

      - name: 10. IPK ellenőrzése
        shell: bash
        run: |
          set -euo pipefail
          IPK="webos/$IPK_FILE_NAME"
          ar t "$IPK"
          # FONTOS: a data.tar.gz-t ELŐBB fájlba mentjük, és csak utána greppelünk.
          # Korábban a listát csövön keresztül szűrtük `grep -q`-val: a grep az
          # első találatnál kilép, ilyenkor az `ar`/`tar` SIGPIPE-pal (141) áll
          # le, a `set -o pipefail` pedig emiatt akkor is elhasalt, amikor a
          # csomagban minden rendben volt (ez okozta a 2.4.4 CI-hibáját).
          rm -rf /tmp/ipk-check
          mkdir -p /tmp/ipk-check
          ar p "$IPK" data.tar.gz > /tmp/ipk-data.tar.gz
          test -s /tmp/ipk-data.tar.gz
          tar tzf /tmp/ipk-data.tar.gz > /tmp/ipk-files.txt
          echo "IPK tartalma:"
          cat /tmp/ipk-files.txt
          grep -E "appinfo.json|index.html|icon-rt2.png" /tmp/ipk-files.txt
          # Az induló videónak ÉS a fekete indítóképnek BENNE KELL lennie a csomagban.
          if ! grep -qx '\./usr/palm/applications/hu\.rt\.iptv\.webos/assets/intro\.mp4' /tmp/ipk-files.txt; then
            echo "HIBA: az induló videó (assets/intro.mp4) hiányzik az IPK-ból." >&2
            exit 1
          fi
          for required in splash-screen.png assets/intro-poster.jpg; do
            if ! grep -qx "\./usr/palm/applications/hu\.rt\.iptv\.webos/$required" /tmp/ipk-files.txt; then
              echo "HIBA: hiányzik az IPK-ból: $required" >&2
              exit 1
            fi
          done
          tar xzf /tmp/ipk-data.tar.gz -C /tmp/ipk-check \
            ./usr/palm/applications/hu.rt.iptv.webos/index.html \
            ./usr/palm/applications/hu.rt.iptv.webos/appinfo.json \
            ./usr/palm/applications/hu.rt.iptv.webos/assets/intro.mp4 \
            ./usr/palm/applications/hu.rt.iptv.webos/splash-screen.png
          cmp -s build/webos/index.html /tmp/ipk-check/usr/palm/applications/hu.rt.iptv.webos/index.html || {
            echo "HIBA: az IPK index.html fájlja nem egyezik a mostani builddel." >&2
            exit 1
          }
          cmp -s build/webos/assets/intro.mp4 /tmp/ipk-check/usr/palm/applications/hu.rt.iptv.webos/assets/intro.mp4 || {
            echo "HIBA: az IPK-ba került induló videó nem egyezik a mostani builddel." >&2
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("/tmp/ipk-check/usr/palm/applications/hu.rt.iptv.webos")
          packaged = json.loads((base / "appinfo.json").read_text())
          if packaged.get("version") != "2.4.8":
              raise SystemExit(f"HIBA: csomagolt app verziója: {packaged.get('version')}")
          if packaged.get("splashBackground") != "splash-screen.png":
              raise SystemExit("HIBA: a csomagolt appinfo.json nem a fekete indítóképet használja.")
          if packaged.get("spinnerOnLaunch") is not False:
              raise SystemExit("HIBA: a csomagolt appinfo.json-ben a spinnerOnLaunch nincs kikapcsolva.")
          splash = base / "splash-screen.png"
          if not splash.is_file():
              raise SystemExit("HIBA: hiányzik a csomagból a splash-screen.png.")
          intro = base / "assets" / "intro.mp4"
          if not intro.is_file() or intro.stat().st_size < 1024 * 1024:
              raise SystemExit("HIBA: az induló videó (assets/intro.mp4) hiányzik vagy túl kicsi a csomagban.")
          html = (base / "index.html").read_text()
          if 'id="root"' not in html or '/src/main.tsx' in html:
              raise SystemExit("HIBA: a csomagolt index.html hiányos vagy nem production build.")
          if "LG webOS TV · FEKVŐ 1920 × 1080" in html:
              raise SystemExit("HIBA: régi, fölösleges indítófelirat maradt.")
          if 'class="boot-spinner"' in html or 'class="boot-text"' in html:
              raise SystemExit("HIBA: a régi diagnosztikai indítóképernyő maradt a csomagban.")
          if 'class="boot-title"' in html or "webos-splash" in html:
              raise SystemExit("HIBA: a régi nagy TV feliratos indítóképernyő maradt a csomagban.")
          if 'id="boot-splash"' not in html or "assets/intro.mp4" not in html:
              raise SystemExit("HIBA: az induló videó overlay (#boot-splash) nem került a csomagolt HTML-be.")
          if "assets/intro-poster.jpg" not in html:
              raise SystemExit("HIBA: az induló videó plakátja (assets/intro-poster.jpg) nem került a csomagolt HTML-be.")
          # A csatorna csak az induló videó után indulhat (dekóder-ütközés a TV-n).
          if "__IPTV_INTRO_ACTIVE__" not in html or "iptv-intro-done" not in html:
              raise SystemExit("HIBA: hiányzik az induló videó lejátszás-kapuja (__IPTV_INTRO_ACTIVE__ / iptv-intro-done).")
          if "iptv-intro-done" not in html:
              raise SystemExit("HIBA: a VideoPlayer nem várja meg az induló videó végét (introGate).")
          if "focusSpatially" not in html or "normalizeKey" not in html:
              raise SystemExit("HIBA: a távirányító-kezelő nem került bele a csomagolt HTML-be.")
          import re as re_mod
          if re_mod.search(r'<script[^>]*type="module"', html):
              raise SystemExit("HIBA: module script maradt a csomagban - a Chrome<61 TV-motorokon (webOS 3.x/4.0) az app el sem indulna!")
          if "IPTV-ES5-APP" not in html or "IPTV-ES5-POLYFILLS" not in html:
              raise SystemExit("HIBA: az ES5-re fordított app vagy a polyfill blokk hiányzik a csomagolt HTML-ből.")
          print(f"OK: HTML {len(html)} byte, induló videó {intro.stat().st_size} byte, indítókép = a videó első kockája, verzió {packaged.get('version')}.")
          PY
          echo "OK: IPK tartalma rendben"

      - name: 11. Diagnosztikai eredmények mentése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webos-build-diagnosis
          path: |
            build/web/index.html
            webos/appinfo.json
            webos/webos.js
          if-no-files-found: error
          retention-days: 7

      - name: 12. Verziózott Release frissítése ír idő szerint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(python3 -c 'import json; print(json.load(open("webos/appinfo.json"))["version"])')"
          EXPECTED_TAG="v$CURRENT_VERSION"
          [[ "$RELEASE_TAG" == "$EXPECTED_TAG" ]] || {
            echo "HIBA: RELEASE_TAG=$RELEASE_TAG, de az alkalmazás verziója $CURRENT_VERSION; állítsd a tagot $EXPECTED_TAG értékre." >&2
            exit 1
          }

          # A korábbi kiadásból olvassuk ki az előző verziót és az IPK feltöltési idejét.
          OLD_VERSION="ismeretlen"
          OLD_RELEASE_DATETIME="nincs korábbi feltöltés"
          if gh release view "$OLD_RELEASE_TAG" >/dev/null 2>&1; then
            OLD_VERSION="$(gh release view "$OLD_RELEASE_TAG" --json body --jq '.body' | grep -m 1 -E 'Most feltöltött alkalmazás verziója|Az alkalmazás belső verziója|Aktuális build verziója' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
            OLD_ASSET_DATE="$(gh release view "$OLD_RELEASE_TAG" --json assets --jq '.assets[] | select(.name == "'"$IPK_FILE_NAME"'") | .updatedAt' | head -n 1)"
            if [[ -n "$OLD_ASSET_DATE" ]]; then
              OLD_RELEASE_DATETIME="$(TZ=Europe/Dublin date -d "$OLD_ASSET_DATE" '+%Y-%m-%d %H:%M %Z (Írország)')"
            fi
          fi
          [[ -n "$OLD_VERSION" ]] || OLD_VERSION="ismeretlen"

          RELEASE_DATETIME="$(TZ=Europe/Dublin date '+%Y-%m-%d %H:%M %Z (Írország)')"
          LOCAL_SHA="$(sha256sum "webos/$IPK_FILE_NAME" | awk '{print $1}')"

          # A Release neve az alkalmazás tényleges verziója lesz, nem a régi v2.3.1.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE – LG webOS TV v$CURRENT_VERSION" --notes "LG webOS TV IPK kiadás."
          fi
          gh release upload "$RELEASE_TAG" "webos/$IPK_FILE_NAME" --clobber

          NEW_ASSET_DATE="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name == "'"$IPK_FILE_NAME"'") | .updatedAt' | head -n 1)"
          [[ -n "$NEW_ASSET_DATE" ]] || { echo "HIBA: nem található a feltöltött IPK időbélyege." >&2; exit 1; }
          RELEASE_UPDATED_DATETIME="$(TZ=Europe/Dublin date -d "$NEW_ASSET_DATE" '+%Y-%m-%d %H:%M %Z (Írország)')"

          sed \
            -e "s/{{RELEASE_DATETIME}}/$RELEASE_DATETIME/g" \
            -e "s/{{RELEASE_UPDATED_DATETIME}}/$RELEASE_UPDATED_DATETIME/g" \
            -e "s/{{CURRENT_VERSION}}/$CURRENT_VERSION/g" \
            -e "s/{{PREVIOUS_VERSION}}/$OLD_VERSION/g" \
            -e "s/{{PREVIOUS_DATETIME}}/$OLD_RELEASE_DATETIME/g" \
            release-notes.md > /tmp/release-notes.md
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE – LG webOS TV v$CURRENT_VERSION" --notes-file /tmp/release-notes.md

          # Csak az egyetlen IPK maradhat a Release-ben.
          while IFS= read -r asset; do
            [[ -z "$asset" || "$asset" == "$IPK_FILE_NAME" ]] && continue
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')

          REMOTE_SHA="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name == "'"$IPK_FILE_NAME"'") | .digest' | sed 's/^sha256://')"
          [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" == "$LOCAL_SHA" ]] || {
            echo "HIBA: a Release-ben lévő IPK nem egyezik a most épített fájllal." >&2
            echo "Helyi SHA256: $LOCAL_SHA / Release SHA256: $REMOTE_SHA" >&2
            exit 1
          }
          ASSET_COUNT="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
          [[ "$ASSET_COUNT" == "1" ]] || {
            echo "HIBA: a Release-ben $ASSET_COUNT fájl van; pontosan 1 IPK kell." >&2
            exit 1
          }

          # A régi, félrevezető v2.3.1 Release és Git-tag eltávolítása csak az új IPK ellenőrzése után.
          if [[ "$OLD_RELEASE_TAG" != "$RELEASE_TAG" ]] && gh release view "$OLD_RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$OLD_RELEASE_TAG" --yes --cleanup-tag
          fi
          echo "OK: $IPK_FILE_NAME v$CURRENT_VERSION feltöltve; SHA-256 egyezik; ír helyi idő; előző verzió: $OLD_VERSION ($OLD_RELEASE_DATETIME)."

      - name: 13. Összefoglaló
        if: always()
        shell: bash
        run: |
          {
            echo "## LG webOS IPK építés és diagnosztika"
            echo "- Indítás: kizárólag kézzel (workflow_dispatch)."
            echo "- Ellenőrzés: forrásfájlok, HTML build, webOS-frissítő, távirányító-kezelés, platformtisztaság, induló videó a csomagban (indítókép nélkül), verziók és szintaxis."
            echo "- IPK: csomagtartalom, HTML, verzió, ES5/polyfill, távirányító-kezelés és SHA-256 ellenőrzése."
            echo "- Kimenet: IPK artifact és GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
