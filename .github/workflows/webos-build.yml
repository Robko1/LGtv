name: IPK építés

# Kizárólag LG webOS TV IPK build; minden forrás a jelenlegi repóból származik.
# Kézi indítás (workflow_dispatch), automatikus futás nincs.
# Kimenet: az aktuális verziójú Release-ben kizárólag az IPTV-RT.ipk marad.
# A teljes forrásdiagnosztika és IPK-ellenőrzés ebben a workflow-ban fut.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-webos-build
  cancel-in-progress: false

env:
  IPK_FILE_NAME: 'IPTV-RT.ipk'
  RELEASE_TITLE: 'IPTV-RT'

jobs:
  webos-epites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 1. Forrás letöltése (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 3. Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: 3. Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 4. Kézi diagnosztika – szükséges forrásfájlok
        shell: bash
        run: |
          set -euo pipefail
          test -s web/package.json
          test -s web/index.html
          test -s webos/appinfo.json
          test -s webos/webos.js
          echo "OK: a szükséges web és webOS fájlok megvannak."

      - name: 5. Függőségek telepítése
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --prefix web --no-audit --no-fund
          pip install Pillow --break-system-packages -q || pip install Pillow -q
          # A feltöltött splash-screen.png marad az egyetlen kezdőkép.
          # Automatikus átméretezés 1920x1080-ra, majd adaptív palettás PNG-
          # tömörítés. A cél szigorúan 699 KiB, nem 700 KiB; a legjobb olyan
          # színmélységet választjuk, amely ezt a határt teljesíti.
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io
          path = Path("webos/splash-screen.png")
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("HIBA: hiányzik a feltöltött webos/splash-screen.png.")
          with Image.open(path) as original:
              original.load()
              source = original.convert("RGB")
          if source.size != (1920, 1080):
              print(f"Automatikus splash-méretezés: {source.size} -> 1920x1080.")
              source = source.resize((1920, 1080), Image.Resampling.LANCZOS)
          limit = 699 * 1024
          best = None
          # Először a jobb minőségű 256 színt próbáljuk, majd fokozatosan
          # csökkentjük a színpalettát, amíg biztosan 699 KiB alá nem ér.
          for colors in (256, 224, 192, 160, 128, 112, 96, 80, 64, 48, 32):
              reduced = source.quantize(
                  colors=colors,
                  method=Image.Quantize.MEDIANCUT,
                  dither=Image.Dither.FLOYDSTEINBERG,
              )
              buffer = io.BytesIO()
              reduced.save(buffer, format="PNG", optimize=True, compress_level=9)
              data = buffer.getvalue()
              print(f"Splash optimalizálás: {colors} szín -> {len(data)} byte.")
              if len(data) < limit:
                  best = data
                  print(f"OK: cél teljesült: {len(data)} byte / {limit - 1} byte alatt.")
                  break
          if best is None:
              raise SystemExit("HIBA: a splash PNG 32 színnel sem fér be 699 KiB alá.")
          path.write_bytes(best)
          with Image.open(path) as check:
              if check.size != (1920, 1080) or check.mode != "P":
                  raise SystemExit(f"HIBA: hibás optimalizált splash: {check.size}, {check.mode}.")
          if path.stat().st_size >= limit:
              raise SystemExit(f"HIBA: a splash elérte vagy túllépte a 699 KiB-os határt: {path.stat().st_size} byte.")
          print(f"VÉGEREDMÉNY: 1920x1080 palettás PNG, {path.stat().st_size} byte (699 KiB alatt).")
          PY
          # A jóváhagyott, átlátszó és lekerekített ikonokat használjuk;
          # a build ne generálja őket újra a régi gyökér ikonkep.png-ből.
          python3 - << 'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io
          small = Path("webos/icon-rt2.png")
          large = Path("webos/largeIcon-rt2.png")
          for path in (small, large):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"HIBA: hiányzik vagy üres az új ikon: {path}")
          small_img = Image.open(small).convert("RGBA")
          large_img = Image.open(large).convert("RGBA")
          Path("webos/assets").mkdir(parents=True, exist_ok=True)
          # A webes felület az ikonokat beégetett adat URL-ként használja;
          # külön, nem hivatkozott public/ikonkep.png nem kerül a buildbe.
          def icon_b64(img, px):
              thumb = img.resize((px, px), Image.Resampling.LANCZOS)
              buffer = io.BytesIO()
              thumb.save(buffer, format="PNG", optimize=True)
              return base64.b64encode(buffer.getvalue()).decode("ascii")
          Path("web/src/generatedIcon.ts").write_text(
              '// Beégetett ikonok a jóváhagyott webos ikonfájlokból.\n'
              '// Az átlátszó háttér és a lekerekített szélek megmaradnak.\n'
              'export const APP_ICON_DATA_URL = "data:image/png;base64,' + icon_b64(large_img, 128) + '";\n'
              'export const APP_ICON_SMALL_DATA_URL = "data:image/png;base64,' + icon_b64(small_img, 32) + '";\n',
              encoding="utf-8"
          )
          print("OK: a jóváhagyott kis és nagy ikon használatra előkészítve.")
          PY

      - name: 5b. Alkalmazás-regressziós tesztek
        shell: bash
        run: |
          set -euo pipefail
          # Csak az alkalmazás működéséhez tartozó regressziós tesztek futnak.
          # Nincs külön HTML indítóképernyő vagy animációs reveal-teszt.
          npm test

      - name: 5c. Verzió automatikus emelése és mentése (csak sikeres tesztek után)
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_KEY_ID: ${{ secrets.RELEASE_GPG_KEY_ID }}
          RELEASE_SSH_PRIVATE_KEY: ${{ secrets.RELEASE_SSH_PRIVATE_KEY }}
          RELEASE_COMMIT_NAME: ${{ secrets.RELEASE_COMMIT_NAME }}
          RELEASE_COMMIT_EMAIL: ${{ secrets.RELEASE_COMMIT_EMAIL }}
        run: |
          set -euo pipefail
          # Minden kézi IPK-build új patch verziót kap. A verziót a main ágra
          # is visszamentjük, hogy a következő build ne ugyanarról a régi számról induljon.
          CURRENT="$(python3 - <<'PY'
          import json, re
          from pathlib import Path
          src = Path("web/src/appVersion.ts").read_text(encoding="utf-8")
          m = re.search(r"WEB_VERSION\s*=\s*'([0-9]+)\.([0-9]+)\.([0-9]+)'", src)
          if not m:
              raise SystemExit("HIBA: nem olvasható a WEB_VERSION.")
          print(".".join(m.groups()))
          PY
          )"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          export CURRENT NEXT
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          old, new = os.environ["CURRENT"], os.environ["NEXT"]
          p = Path("web/src/appVersion.ts")
          src = p.read_text(encoding="utf-8")
          src, count = re.subn(r"(WEB_VERSION\s*=\s*')[^']+(')", r"\g<1>" + new + r"\2", src, count=1)
          if count != 1:
              raise SystemExit("HIBA: WEB_VERSION frissítése nem sikerült.")
          # A verziótörténet legelső bejegyzése az aktuális kiadás.
          src, count = re.subn(r"(version:\s*')[^']+(')", r"\g<1>" + new + r"\2", src, count=1)
          if count != 1:
              raise SystemExit("HIBA: verziótörténet frissítése nem sikerült.")
          p.write_text(src, encoding="utf-8")
          manifest_path = Path("webos/appinfo.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          # EGYETLEN igazságforrás a web/src/appVersion.ts WEB_VERSION-je.
          # Ha valaki kézzel emelte a webes verziót és az appinfo.json nem
          # követte, itt szinkronizáljuk (korábban ez a buildet is megállította).
          if manifest.get("version") != old:
              print(f"appinfo.json szinkron a webes verzióhoz: {manifest.get('version')} -> {old}")
              manifest["version"] = old
          manifest["version"] = new
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Verzió emelve: {old} -> {new}")
          PY
          echo "VERSION=$NEXT" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$NEXT" >> "$GITHUB_ENV"
          if [[ -n "${RELEASE_GPG_PRIVATE_KEY:-}" ]]; then
            # A GitHub „Verified” commithez a kulcs nyilvános részének már a
            # GitHub-fiókhoz kell tartoznia. A privát kulcs csak Actions secret,
            # fájlba és naplóba nem kerül.
            [[ -n "${RELEASE_GPG_KEY_ID:-}" && -n "${RELEASE_COMMIT_EMAIL:-}" ]] || {
              echo "HIBA: RELEASE_GPG_KEY_ID és RELEASE_COMMIT_EMAIL is kell az aláírt commithez." >&2
              exit 1
            }
            printf '%s\n' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import >/dev/null
            git config user.name "${RELEASE_COMMIT_NAME:-Robko1 release bot}"
            git config user.email "$RELEASE_COMMIT_EMAIL"
            git config user.signingkey "$RELEASE_GPG_KEY_ID"
            git config commit.gpgsign true
            git config gpg.program gpg
            git add web/src/appVersion.ts webos/appinfo.json
            git commit -S -m "chore: bump webOS IPK version to v$NEXT"
            echo "SIGNED_COMMIT=1" >> "$GITHUB_ENV"
          elif [[ -n "${RELEASE_SSH_PRIVATE_KEY:-}" ]]; then
            # GitHub az SSH-aláíró kulcsot is Verifiedként kezeli, ha annak
            # publikus része előzőleg a fiók SSH signing keys listájában van.
            [[ -n "${RELEASE_COMMIT_EMAIL:-}" ]] || {
              echo "HIBA: RELEASE_COMMIT_EMAIL is kell az aláírt SSH commithoz." >&2
              exit 1
            }
            SIGNING_KEY_FILE="$RUNNER_TEMP/release-signing-key"
            printf '%s\n' "$RELEASE_SSH_PRIVATE_KEY" > "$SIGNING_KEY_FILE"
            chmod 600 "$SIGNING_KEY_FILE"
            git config user.name "${RELEASE_COMMIT_NAME:-Robko1 release bot}"
            git config user.email "$RELEASE_COMMIT_EMAIL"
            git config gpg.format ssh
            git config user.signingkey "$SIGNING_KEY_FILE"
            git config commit.gpgsign true
            git add web/src/appVersion.ts webos/appinfo.json
            git commit -S -m "chore: bump webOS IPK version to v$NEXT"
            echo "SIGNED_COMMIT=1" >> "$GITHUB_ENV"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add web/src/appVersion.ts webos/appinfo.json
            git commit -m "chore: bump webOS IPK version to v$NEXT"
            echo "SIGNED_COMMIT=0" >> "$GITHUB_ENV"
          fi
          # A build közben a main ágra érkező más commitokat is meg kell tartani.
          # A saját verziócommitot mindig a legfrissebb main tetejére rebase-eljük.
          # Push-elutasítás esetén újra fetch + rebase következik; force push tilos.
          PUSHED=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "HIBA: a verziófájlokban közben érkezett módosítással ütközés történt." >&2
              echo "A távoli main változásait nem írjuk felül; a build biztonságosan leáll." >&2
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              PUSHED=1
              break
            fi
            echo "A main időközben ismét frissült; újrapróbálás ($attempt/5)."
            sleep 2
          done
          if [[ "$PUSHED" != "1" ]]; then
            echo "HIBA: öt próbálkozás után sem sikerült biztonságosan frissíteni a main ágat." >&2
            exit 1
          fi
          echo "BUILD_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 6. Kézi diagnosztika – forrás, webOS frissítő és csomagoló
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://api.github.com/repos/Robko1/LGtv/releases/latest' web/src/services/webosUpdateService.ts
          grep -Fq 'normalizeKey' webos/webos.js
          grep -Fq 'focusSpatially' webos/webos.js
          grep -Fq 'KEYCODE_TO_KEY' webos/webos.js
          grep -Fq 'makeKeyEvent' webos/webos.js
          # ES5 szintaxis őrzés: régebbi LG webOS (Chrome 38-53) elhasal a modern szintaxison
          if grep -nE '=>|`|catch \{|catch\{|^[[:space:]]*(let|const) |[;{(=] ?(let|const) ' webos/webos.js; then
            echo "HIBA: modern JS szintaxis került a webos.js-be - régebbi LG TV-ken a távirányító-kezelő nem töltődne be." >&2
            exit 1
          fi
          if grep -RniE 'IPTVNative|Android|WebView|\.apk' web/src web/index.html; then
            echo "HIBA: más platformra utaló kód maradt a webOS forrásban." >&2
            exit 1
          fi
          # 2.5.0-tól NINCS induló videó a programban: egyetlen videófájl sem
          # lehet az assetek között (kisebb IPK, azonnali főoldal).
          if find webos/assets -type f | grep -Ei '\.(mp4|webm|mov)$'; then
            echo "HIBA: videó van a webOS assetek között, pedig 2.5.0-tól nincs induló videó." >&2
            exit 1
          fi
          test -s webos/splash-screen.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          splash = Path("webos/splash-screen.png")
          img = Image.open(splash)
          if img.size != (1920, 1080):
              raise SystemExit(f"HIBA: az automatikus átméretezés után is hibás az indítókép mérete: {img.size}.")
          # Az indítókép 1920x1080-as palettás PNG, szigorúan 699 KiB alatt.
          if splash.stat().st_size >= 699 * 1024:
              raise SystemExit("HIBA: az indítókép nem kisebb 699 KiB-nál.")
          if img.mode != "P":
              raise SystemExit(f"HIBA: az indítókép módja {img.mode}, várt palettás PNG (P).")
          print(f"OK: webOS natív indítókép {img.size}, {splash.stat().st_size} byte.")
          PY
          bash -n tools/build-webos.sh
          node --check webos/webos.js
          python3 -m py_compile webos/tools/build-ipk.py
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          manifest = json.loads(Path("webos/appinfo.json").read_text(encoding="utf-8"))
          version_source = Path("web/src/appVersion.ts").read_text(encoding="utf-8")
          match = re.search(r"WEB_VERSION\s*=\s*'([^']+)'", version_source)
          if not match:
              raise SystemExit("WEB_VERSION nem található")
          if manifest.get("version") != match.group(1):
              raise SystemExit(f"Verzióeltérés: appinfo.json={manifest.get('version')} / WEB_VERSION={match.group(1)}")
          # A TV saját indítóképe a webOS natív splash PNG
          # (ugyanaz a kép, ugyanazokból a forrásértékekből), a rendszer forgó
          # fogaskereke pedig ne jelenjen meg a kép előtt.
          if manifest.get("splashBackground") != "splash-screen.png":
              raise SystemExit("HIBA: a webOS manifest nem a splash-screen.png indítóképet használja.")
          if manifest.get("spinnerOnLaunch") is not False:
              raise SystemExit("HIBA: a webOS manifest-ben a spinnerOnLaunch nincs kikapcsolva.")
          from PIL import Image, ImageStat
          splash_png = Path("webos/splash-screen.png")
          if not splash_png.is_file():
              raise SystemExit("HIBA: hiányzik a webos/splash-screen.png indítókép.")
          splash_raw = Image.open(splash_png)
          if splash_raw.size != (1920, 1080):
              raise SystemExit(f"HIBA: az automatikus átméretezés után is hibás az indítókép mérete: {splash_raw.size}.")
          if splash_png.stat().st_size >= 699 * 1024 or splash_raw.mode != "P":
              raise SystemExit(f"HIBA: splash PNG követelmény sérült: {splash_png.stat().st_size} byte, {splash_raw.mode}.")
          splash_img = splash_raw.convert("RGB")
          mean = ImageStat.Stat(splash_img).mean
          if all(channel > 250 for channel in mean):
              raise SystemExit("HIBA: az indítókép tiszta fehér - ez fehér villanást okozna.")
          print(f"LG webOS verziók egyeznek: {match.group(1)}; indítókép = a betöltőképernyő háttere, spinner nélkül.")
          PY
          echo "OK: webOS-frissítő, platformtisztaság, shell szintaxis, IPK-csomagoló és verziók ellenőrizve."

      - name: 7. Webes felület fordítása webOS-re
        working-directory: web
        env:
          VITE_WEBOS: 'true'
          VITE_WEBOS_FAST_LOAD: 'true'
          VITE_WEBOS_SMALL_PLAYER: 'true'
        run: npm run build

      - name: 8. Kézi diagnosztika – HTML és webOS konfiguráció
        shell: bash
        run: |
          set -euo pipefail
          FILE=build/web/index.html
          test -s "$FILE"
          python3 -m json.tool webos/appinfo.json >/dev/null
          grep -Fq 'id="root"' "$FILE"
          test -s webos/webos.js
          echo "HTML méret: $(wc -c < "$FILE") byte"
          echo "OK: a HTML build és az appinfo.json ellenőrzése sikeres."

      - name: 9. webOS IPK építése
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/build-webos.sh webos/tools/build-ipk.py
          # 2.5.0: nincs induló videó; csak a logó képkockája kerül a csomagba
          # indítóképként (webos/splash-screen.png, lásd tools/build-webos.sh).
          VERSION="$VERSION" bash tools/build-webos.sh
          ls -lh webos/*.ipk
          test -s "webos/$IPK_FILE_NAME"

      - name: 10. IPK ellenőrzése
        shell: bash
        run: |
          set -euo pipefail
          IPK="webos/$IPK_FILE_NAME"
          ar t "$IPK"
          # FONTOS: a data.tar.gz-t ELŐBB fájlba mentjük, és csak utána greppelünk.
          # Korábban a listát csövön keresztül szűrtük `grep -q`-val: a grep az
          # első találatnál kilép, ilyenkor az `ar`/`tar` SIGPIPE-pal (141) áll
          # le, a `set -o pipefail` pedig emiatt akkor is elhasalt, amikor a
          # csomagban minden rendben volt (ez okozta a 2.4.4 CI-hibáját).
          rm -rf /tmp/ipk-check
          mkdir -p /tmp/ipk-check
          ar p "$IPK" data.tar.gz > /tmp/ipk-data.tar.gz
          test -s /tmp/ipk-data.tar.gz
          tar tzf /tmp/ipk-data.tar.gz > /tmp/ipk-files.txt
          echo "IPK tartalma:"
          cat /tmp/ipk-files.txt
          grep -E "appinfo.json|index.html|icon-rt2.png" /tmp/ipk-files.txt
          # Indítókép (a logó képkockája) KELL, videó viszont NEM lehet a csomagban.
          if ! grep -qx '\./usr/palm/applications/hu\.rt\.iptv\.webos/splash-screen\.png' /tmp/ipk-files.txt; then
            echo "HIBA: a logó indítókép (splash-screen.png) hiányzik az IPK-ból." >&2
            exit 1
          fi
          if grep -Ei '\.(mp4|webm|mov)$' /tmp/ipk-files.txt; then
            echo "HIBA: videó került az IPK-ba, pedig 2.5.0-tól nincs induló videó." >&2
            exit 1
          fi
          tar xzf /tmp/ipk-data.tar.gz -C /tmp/ipk-check \
            ./usr/palm/applications/hu.rt.iptv.webos/index.html \
            ./usr/palm/applications/hu.rt.iptv.webos/appinfo.json \
            ./usr/palm/applications/hu.rt.iptv.webos/splash-screen.png
          cmp -s build/webos/index.html /tmp/ipk-check/usr/palm/applications/hu.rt.iptv.webos/index.html || {
            echo "HIBA: az IPK index.html fájlja nem egyezik a mostani builddel." >&2
            exit 1
          }
          cmp -s build/webos/splash-screen.png /tmp/ipk-check/usr/palm/applications/hu.rt.iptv.webos/splash-screen.png || {
            echo "HIBA: az IPK-ba került indítókép nem egyezik a mostani builddel." >&2
            exit 1
          }
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          base = Path("/tmp/ipk-check/usr/palm/applications/hu.rt.iptv.webos")
          packaged = json.loads((base / "appinfo.json").read_text())
          if packaged.get("version") != os.environ.get("VERSION"):
              raise SystemExit(f"HIBA: csomagolt app verziója: {packaged.get('version')}, várt: {os.environ.get('VERSION')}")
          if packaged.get("splashBackground") != "splash-screen.png":
              raise SystemExit("HIBA: a csomagolt appinfo.json nem a fekete indítóképet használja.")
          if packaged.get("spinnerOnLaunch") is not False:
              raise SystemExit("HIBA: a csomagolt appinfo.json-ben a spinnerOnLaunch nincs kikapcsolva.")
          splash = base / "splash-screen.png"
          if not splash.is_file():
              raise SystemExit("HIBA: hiányzik a csomagból a splash-screen.png.")
          if (base / "assets" / "intro.mp4").exists():
              raise SystemExit("HIBA: az induló videó (assets/intro.mp4) még benne van a csomagban.")
          html = (base / "index.html").read_text()
          if 'id="root"' not in html:
              raise SystemExit("HIBA: a csomagolt index.html hiányos vagy nem production build.")
          # A fejlesztői belépő (`<script type="module" src="/src/main.tsx">`) nem
          # maradhat a csomagban: a Chrome<61 TV-motorokon az app el sem indulna.
          #
          # Korábban ez sima szövegrészlet-keresés volt (a `/src/main.tsx`
          # előfordulását nézte bárhol a HTML-ben), ezért egy olyan
          # FORRÁSKOMMENT is megbuktatta a kiadást, amely csak MEGEMLÍTETTE a
          # fájlnevet – a webos.js beégetve kerül az index.html-be, és pont ez
          # állította le a 2.5.108-as buildet. Most a valódi script-hivatkozást
          # keressük; egy komment vagy egy szöveg nem számít annak.
          if re.search(r'<script[^>]*\ssrc=["\'][^"\']*/src/main\.tsx', html):
              raise SystemExit("HIBA: a csomagolt index.html a fejlesztői belépőt tartalmazza (nem production build).")
          if re.search(r'<script[^>]*\ssrc=["\']/src/', html):
              raise SystemExit("HIBA: a csomagolt index.html fejlesztői /src/ hivatkozást tartalmaz (nem production build).")
          if "LG webOS TV · FEKVŐ 1920 × 1080" in html:
              raise SystemExit("HIBA: régi, fölösleges indítófelirat maradt.")
          # A csomagban csak a webOS natív PNG maradhat; saját HTML-es indító
          # képernyő, takaróréteg vagy reveal-vezérlés nem lehet benne.
          if 'id="tv-curtain"' in html or 'id="boot-screen"' in html or "__IPTV_REVEAL__" in html:
            raise SystemExit("HIBA: egyedi HTML-es indítóképernyő/reveal kód maradt a csomagban.")
          # Nincs induló videó.
          if "assets/intro.mp4" in html or "intro-boot.js" in html:
            raise SystemExit("HIBA: induló videó maradt a csomagolt HTML-ben.")
          # 2.5.158: a betöltőképernyő háttere CSS színátmenet – nincs
          # splash-bg.jpg, és ha mégis bekerülne, azt hibának vesszük.
          ipk_files = Path("/tmp/ipk-files.txt").read_text()
          if "/splash-bg.jpg" in ipk_files:
              raise SystemExit("HIBA: felesleges splash-bg.jpg került a csomagba.")
          # A HTML kicsi maradt, a JS/CSS és a platform indítókép KÜLÖN fájl.
          for needed in ("/app.js", "/app.css", "/splash-screen.png"):
              if needed not in ipk_files:
                  raise SystemExit(f"HIBA: hiányzik a {needed} fájl az IPK-ból – a HTML nem tudja betölteni.")
          if len(html) > 200_000:
              raise SystemExit(f"HIBA: a csomagolt index.html {len(html)} byte – újra több másodperc a first-paint.")

          if "focusSpatially" not in html or "normalizeKey" not in html:
              raise SystemExit("HIBA: a távirányító-kezelő nem került bele a csomagolt HTML-be.")
          import re as re_mod
          if re_mod.search(r'<script[^>]*type="module"', html):
              raise SystemExit("HIBA: module script maradt a csomagban - a Chrome<61 TV-motorokon (webOS 3.x/4.0) az app el sem indulna!")
          if "IPTV-ES5-APP" not in html or "IPTV-ES5-POLYFILLS" not in html:
              raise SystemExit("HIBA: az ES5-re fordított app vagy a polyfill blokk hiányzik a csomagolt HTML-ből.")
          print(f"OK: HTML {len(html)} byte, nincs saját animált indítóképernyő, verzió {packaged.get('version')}.")
          PY
          echo "OK: IPK tartalma rendben"

      - name: 11. Diagnosztikai eredmények mentése
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webos-build-diagnosis
          path: |
            build/web/index.html
            webos/appinfo.json
            webos/webos.js
          if-no-files-found: error
          retention-days: 7

      - name: 12. Régi IPK-k átvitele a privát repóba és új verzió közzététele
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IPK_REPO_TOKEN: ${{ secrets.IPK_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          : "${IPK_REPO_TOKEN:?HIBA: hiányzik az IPK_REPO_TOKEN Actions secret.}"
          CURRENT_VERSION="$(python3 -c 'import json; print(json.load(open("webos/appinfo.json"))["version"])')"
          EXPECTED_TAG="v$CURRENT_VERSION"
          [[ "$RELEASE_TAG" == "$EXPECTED_TAG" ]] || {
            echo "HIBA: RELEASE_TAG=$RELEASE_TAG, de az alkalmazás verziója $CURRENT_VERSION; elvárt: $EXPECTED_TAG." >&2
            exit 1
          }

          mkdir -p /tmp/ipk-migration
          RELEASES_JSON=/tmp/ipk-migration/releases.json
          gh release list --repo Robko1/LGtv --limit 1000 --json tagName,isDraft,isPrerelease,publishedAt > "$RELEASES_JSON"

          # A korábbi nyilvános kiadások IPK-it egyenként átvisszük a privát
          # Ipk repóba. A nyilvános assetet csak a privát feltöltés és ellenőrzés
          # UTÁN töröljük. A forráskód és a nyilvános LGtv repó változatlan marad.
          python3 - <<'PY' > /tmp/ipk-migration/tags.txt
          import json
          rows=json.load(open("/tmp/ipk-migration/releases.json"))
          for row in sorted(rows, key=lambda x: x.get("publishedAt") or ""):
              if not row.get("isDraft") and not row.get("isPrerelease") and row.get("tagName"):
                  print(row["tagName"])
          PY

          while IFS= read -r tag; do
            [[ -z "$tag" || "$tag" == "$EXPECTED_TAG" ]] && continue
            assets="$(gh release view "$tag" --repo Robko1/LGtv --json assets --jq '[.assets[].name] | join(",")')"
            [[ ",$assets," == *",IPTV-RT.ipk,"* ]] || continue

            echo "Régi kiadás átvitele: $tag"
            rm -f /tmp/ipk-migration/IPTV-RT.ipk
            gh release download "$tag" --repo Robko1/LGtv --pattern "IPTV-RT.ipk" --dir /tmp/ipk-migration
            test -s /tmp/ipk-migration/IPTV-RT.ipk
            SOURCE_SHA="$(sha256sum /tmp/ipk-migration/IPTV-RT.ipk | awk '{print $1}')"
            SOURCE_BODY="$(gh release view "$tag" --repo Robko1/LGtv --json body --jq '.body')"
            SOURCE_TITLE="$(gh release view "$tag" --repo Robko1/LGtv --json name --jq '.name')"
            SOURCE_COMMIT="$(git rev-parse "$tag^{commit}" 2>/dev/null || true)"
            if [[ -z "$SOURCE_COMMIT" ]]; then
              git fetch origin "refs/tags/$tag:refs/tags/$tag"
              SOURCE_COMMIT="$(git rev-parse "$tag^{commit}")"
            fi

            export GH_TOKEN="$IPK_REPO_TOKEN"
            AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$IPK_REPO_TOKEN" | base64 -w0)"
            if ! gh api "repos/Robko1/Ipk/git/ref/tags/$tag" >/dev/null 2>&1; then
              git -c http.extraheader="$AUTH_HEADER" push https://github.com/Robko1/Ipk.git "$SOURCE_COMMIT:refs/tags/$tag"
            fi
            if ! gh release view "$tag" --repo Robko1/Ipk >/dev/null 2>&1; then
              gh release create "$tag" --repo Robko1/Ipk --title "${SOURCE_TITLE:-IPTV-RT $tag}" --notes "$SOURCE_BODY"
            fi
            gh release upload "$tag" /tmp/ipk-migration/IPTV-RT.ipk --repo Robko1/Ipk --clobber
            TARGET_SHA="$(gh release view "$tag" --repo Robko1/Ipk --json assets --jq '.assets[] | select(.name == "IPTV-RT.ipk") | .digest' | sed 's/^sha256://')"
            [[ "$TARGET_SHA" == "$SOURCE_SHA" ]] || {
              echo "HIBA: a privát repóba átvitt $tag IPK SHA-256 értéke nem egyezik." >&2
              exit 1
            }

            # Csak sikeres privát feltöltés és hash-ellenőrzés után töröljük
            # a régi, nyilvánosan letölthető IPK assetet.
            export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
            gh release delete-asset "$tag" "IPTV-RT.ipk" --repo Robko1/LGtv --yes
          done < /tmp/ipk-migration/tags.txt

          # Az új kiadás Git-tagje a pontosan most lefordított main commitra mutat.
          export GH_TOKEN="$IPK_REPO_TOKEN"
          AUTH_HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$IPK_REPO_TOKEN" | base64 -w0)"
          if ! gh api "repos/Robko1/Ipk/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git -c http.extraheader="$AUTH_HEADER" push https://github.com/Robko1/Ipk.git "$BUILD_COMMIT:refs/tags/$RELEASE_TAG"
          fi

          RELEASE_DATETIME="$(TZ=Europe/Dublin date '+%Y-%m-%d %H:%M %Z (Írország)')"
          LOCAL_SHA="$(sha256sum "webos/$IPK_FILE_NAME" | awk '{print $1}')"
          export RELEASE_TAG
          PREVIOUS_TAG="$(python3 - <<'PY'
          import json, os
          rows=json.load(open("/tmp/ipk-migration/releases.json"))
          rows=[r for r in rows if not r.get("isDraft") and not r.get("isPrerelease") and r.get("tagName") != os.environ["RELEASE_TAG"]]
          rows.sort(key=lambda x:x.get("publishedAt") or "")
          print(rows[-1]["tagName"] if rows else "")
          PY
          )"
          PREVIOUS_VERSION="nincs korábbi kiadás"
          PREVIOUS_DATETIME="nincs korábbi feltöltés"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            PREVIOUS_DATETIME="$(gh release view "$PREVIOUS_TAG" --repo Robko1/Ipk --json publishedAt --jq '.publishedAt' 2>/dev/null || echo "korábbi kiadás")"
            PREVIOUS_VERSION="$PREVIOUS_TAG"
          fi

          if ! gh release view "$RELEASE_TAG" --repo Robko1/Ipk >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo Robko1/Ipk --title "$RELEASE_TITLE – LG webOS TV v$CURRENT_VERSION" --notes "LG webOS TV privát IPK kiadás."
          fi
          gh release upload "$RELEASE_TAG" "webos/$IPK_FILE_NAME" --repo Robko1/Ipk --clobber

          TARGET_SHA="$(gh release view "$RELEASE_TAG" --repo Robko1/Ipk --json assets --jq '.assets[] | select(.name == "IPTV-RT.ipk") | .digest' | sed 's/^sha256://')"
          [[ -n "$TARGET_SHA" && "$TARGET_SHA" == "$LOCAL_SHA" ]] || {
            echo "HIBA: a privát Release IPK SHA-256 értéke nem egyezik a buildelt fájllal." >&2
            exit 1
          }
          ASSET_COUNT="$(gh release view "$RELEASE_TAG" --repo Robko1/Ipk --json assets --jq '.assets | length')"
          [[ "$ASSET_COUNT" == "1" ]] || {
            echo "HIBA: a privát Release-ben $ASSET_COUNT fájl van; pontosan 1 IPK kell." >&2
            exit 1
          }

          # A nyilvános LGtv Release csak verzióinformációt tartalmazzon.
          # Erre szüksége van az alkalmazás nyilvános frissítés-ellenőrzőjének;
          # IPK bináris fájlt SOHA nem töltünk fel ide.
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          PUBLIC_NOTES="Új LG webOS TV verzió: $CURRENT_VERSION. A telepítő IPK kizárólag a privát Robko1/Ipk tárolóból tölthető le."
          if gh release view "$RELEASE_TAG" --repo Robko1/LGtv >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo Robko1/LGtv --title "$RELEASE_TITLE – LG webOS TV v$CURRENT_VERSION" --notes "$PUBLIC_NOTES"
          else
            gh release create "$RELEASE_TAG" --repo Robko1/LGtv --target "$BUILD_COMMIT" --title "$RELEASE_TITLE – LG webOS TV v$CURRENT_VERSION" --notes "$PUBLIC_NOTES"
          fi
          if gh release view "$RELEASE_TAG" --repo Robko1/LGtv --json assets --jq '.assets[].name' | grep -Fxq "IPTV-RT.ipk"; then
            gh release delete-asset "$RELEASE_TAG" "IPTV-RT.ipk" --repo Robko1/LGtv --yes
          fi

          echo "OK: régi IPK-kiadások átvitele/ellenőrzése kész; az új IPK v$CURRENT_VERSION a privát Robko1/Ipk repóban van; a nyilvános Release csak verzióinformációt tartalmaz; SHA-256 egyezik."
      - name: 13. Összefoglaló
        if: always()
        shell: bash
        run: |
          {
            echo "## LG webOS IPK építés és diagnosztika"
            echo "- Indítás: kizárólag kézzel (workflow_dispatch)."
            echo "- Ellenőrzés: forrásfájlok, HTML build, webOS-frissítő, távirányító-kezelés, platformtisztaság, indítókép, verziók és szintaxis."
            echo "- IPK: csomagtartalom, HTML, verzió, ES5/polyfill, távirányító-kezelés és SHA-256 ellenőrzése."
            echo "- Kimenet: IPK és verziótag a privát Robko1/Ipk repóban; a nyilvános LGtv Release csak verzióinformációt tartalmaz."
            if [[ "${SIGNED_COMMIT:-0}" == "1" ]]; then
              echo "- Commit/tag: a beállított GPG- vagy SSH-kulccsal aláírva (GitHub Verified csak a fiókhoz hozzáadott publikus kulccsal jelenik meg)."
            else
              echo "- Commit/tag: nincs GPG/SSH-kulcs beállítva; a RELEASE_* signing secret-ek nélkül a GitHub Verified jelzés nem garantálható."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
