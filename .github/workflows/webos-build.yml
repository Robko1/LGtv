name: IPK építés

# Kizárólag LG webOS TV IPK build; minden forrás a jelenlegi repóból származik.
# Kézi indítás (workflow_dispatch), automatikus futás nincs.
# Kimenet: az aktuális verziójú Release-ben kizárólag az IPTV-RT.ipk marad.
# Diagnosztika: webos-manual-diagnosis.yml (külön, kézi)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-webos-build
  cancel-in-progress: false

env:
  VERSION: '2.3.8'
  IPK_FILE_NAME: 'IPTV-RT.ipk'
  RELEASE_TAG: 'v2.3.8'
  OLD_RELEASE_TAG: 'v2.3.1'
  RELEASE_TITLE: 'IPTV-RT'

jobs:
  webos-epites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 1. Forrás letöltése (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2. Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: 3. Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 4. Kézi diagnosztika – szükséges forrásfájlok
        shell: bash
        run: |
          set -euo pipefail
          test -s web/package.json
          test -s web/index.html
          test -s webos/appinfo.json
          test -s webos/webos.js
          echo "OK: a szükséges web és webOS fájlok megvannak."

      - name: 5. Függőségek telepítése
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm install --prefix web --no-audit --no-fund
          pip install Pillow --break-system-packages -q || pip install Pillow -q

      - name: 6. Kézi diagnosztika – forrás, webOS frissítő és csomagoló
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://api.github.com/repos/Robko1/LGtv/releases/latest' web/src/services/webosUpdateService.ts
          grep -Fq 'normalizeKey' webos/webos.js
          grep -Fq 'focusSpatially' webos/webos.js
          grep -Fq 'KEYCODE_TO_KEY' webos/webos.js
          grep -Fq 'makeKeyEvent' webos/webos.js
          # ES5 szintaxis őrzés: régebbi LG webOS (Chrome 38-53) elhasal a modern szintaxison
          if grep -nE '=>|`|catch \{|catch\{|^[[:space:]]*(let|const) |[;{(=] ?(let|const) ' webos/webos.js; then
            echo "HIBA: modern JS szintaxis került a webos.js-be - régebbi LG TV-ken a távirányító-kezelő nem töltődne be." >&2
            exit 1
          fi
          if grep -RniE 'IPTVNative|Android|WebView|\.apk' web/src web/index.html; then
            echo "HIBA: más platformra utaló kód maradt a webOS forrásban." >&2
            exit 1
          fi
          bash -n tools/build-webos.sh
          node --check webos/webos.js
          python3 -m py_compile webos/tools/build-ipk.py
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          manifest = json.loads(Path("webos/appinfo.json").read_text(encoding="utf-8"))
          version_source = Path("web/src/appVersion.ts").read_text(encoding="utf-8")
          match = re.search(r"WEB_VERSION\s*=\s*'([^']+)'", version_source)
          if not match:
              raise SystemExit("WEB_VERSION nem található")
          if manifest.get("version") != match.group(1):
              raise SystemExit(f"Verzióeltérés: appinfo.json={manifest.get('version')} / WEB_VERSION={match.group(1)}")
          if match.group(1) != "2.3.8":
              raise SystemExit(f"Eltérő buildverzió: várt 2.3.8, kapott {match.group(1)}")
          print(f"LG webOS verziók egyeznek: {match.group(1)}")
          PY
          echo "OK: webOS-frissítő, platformtisztaság, shell szintaxis, IPK-csomagoló és verziók ellenőrizve."

      - name: 7. Webes felület fordítása webOS-re
        working-directory: web
        env:
          VITE_WEBOS: 'true'
          VITE_WEBOS_FAST_LOAD: 'true'
          VITE_WEBOS_SMALL_PLAYER: 'true'
        run: npm run build

      - name: 8. Kézi diagnosztika – HTML és webOS konfiguráció
        shell: bash
        run: |
          set -euo pipefail
          FILE=build/web/index.html
          test -s "$FILE"
          python3 -m json.tool webos/appinfo.json >/dev/null
          grep -Fq 'id="root"' "$FILE"
          test -s webos/webos.js
          echo "HTML méret: $(wc -c < "$FILE") byte"
          echo "OK: a HTML build és az appinfo.json ellenőrzése sikeres."

      - name: 9. webOS IPK építése
        shell: bash
        run: |
          set -euo pipefail
          chmod +x tools/build-webos.sh webos/tools/build-ipk.py
          # Ikonok generálása ha nincsenek
          if [[ ! -f webos/icon.png || ! -f webos/largeIcon.png ]]; then
            python3 - << 'PY'
          from PIL import Image
          img = Image.open("icon.jpg").convert('RGBA')
          img.resize((80,80), Image.LANCZOS).save("webos/icon.png","PNG")
          img.resize((130,130), Image.LANCZOS).save("webos/largeIcon.png","PNG")
          img.resize((512,512), Image.LANCZOS).save("webos/assets/icon_tv.png","PNG")
          PY
          fi
          # Nincs indítóvideó generálás vagy csomagolás.
          VERSION="$VERSION" bash tools/build-webos.sh
          ls -lh webos/*.ipk
          test -s "webos/$IPK_FILE_NAME"

      - name: 10. IPK ellenőrzése
        shell: bash
        run: |
          set -euo pipefail
          IPK="webos/$IPK_FILE_NAME"
          ar t "$IPK"
          ar p "$IPK" data.tar.gz | tar tz | grep -E "appinfo.json|index.html|icon.png"
          if ar p "$IPK" data.tar.gz | tar tz | grep -Ei 'intro[^/]*\.(mp4|webm|mov)|assets/splash\.png'; then
            echo "HIBA: indítóvideó vagy indítókép került az IPK-ba." >&2
            exit 1
          fi
          mkdir -p /tmp/ipk-check
          ar p "$IPK" data.tar.gz | tar xzf - -C /tmp/ipk-check ./usr/palm/applications/hu.rt.iptv.webos/index.html ./usr/palm/applications/hu.rt.iptv.webos/appinfo.json
          cmp -s build/webos/index.html /tmp/ipk-check/usr/palm/applications/hu.rt.iptv.webos/index.html || {
            echo "HIBA: az IPK index.html fájlja nem egyezik a mostani builddel." >&2
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path
          packaged = json.loads(Path("/tmp/ipk-check/usr/palm/applications/hu.rt.iptv.webos/appinfo.json").read_text())
          if packaged.get("version") != "2.3.8":
              raise SystemExit(f"HIBA: csomagolt app verziója: {packaged.get('version')}")
          if "splashBackground" in packaged:
              raise SystemExit("HIBA: a webOS appinfo.json még indítóképet állít be.")
          html = Path("/tmp/ipk-check/usr/palm/applications/hu.rt.iptv.webos/index.html").read_text()
          if 'id="root"' not in html or '/src/main.tsx' in html:
              raise SystemExit("HIBA: a csomagolt index.html hiányos vagy nem production build.")
          if "LG webOS TV · FEKVŐ 1920 × 1080" in html:
              raise SystemExit("HIBA: régi, fölösleges indítófelirat maradt.")
          if 'class="boot-spinner"' in html or 'class="boot-text"' in html:
              raise SystemExit("HIBA: a régi diagnosztikai indítóképernyő maradt a csomagban.")
          if "focusSpatially" not in html or "normalizeKey" not in html:
              raise SystemExit("HIBA: a távirányító-kezelő nem került bele a csomagolt HTML-be.")
          import re as re_mod
          if re_mod.search(r'<script[^>]*type="module"', html):
              raise SystemExit("HIBA: module script maradt a csomagban - a Chrome<61 TV-motorokon (webOS 3.x/4.0) az app el sem indulna!")
          if "IPTV-ES5-APP" not in html or "IPTV-ES5-POLYFILLS" not in html:
              raise SystemExit("HIBA: az ES5-re fordított app vagy a polyfill blokk hiányzik a csomagolt HTML-ből.")
          print("OK: friss HTML, Magic Remote-kezelő, verzió 2.3.8; nincs csomagolt indítóvideó/kép.")
          PY
          echo "OK: IPK tartalma rendben"

      - name: 11. Diagnosztikai eredmények mentése
        uses: actions/upload-artifact@v4
        with:
          name: webos-build-diagnosis
          path: |
            build/web/index.html
            webos/appinfo.json
            webos/webos.js
          if-no-files-found: error
          retention-days: 7

      - name: 12. Verziózott Release frissítése ír idő szerint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION="$(python3 -c 'import json; print(json.load(open("webos/appinfo.json"))["version"])')"
          EXPECTED_TAG="v$CURRENT_VERSION"
          [[ "$RELEASE_TAG" == "$EXPECTED_TAG" ]] || {
            echo "HIBA: RELEASE_TAG=$RELEASE_TAG, de az alkalmazás verziója $CURRENT_VERSION; állítsd a tagot $EXPECTED_TAG értékre." >&2
            exit 1
          }

          # A korábbi kiadásból olvassuk ki az előző verziót és az IPK feltöltési idejét.
          OLD_VERSION="ismeretlen"
          OLD_RELEASE_DATETIME="nincs korábbi feltöltés"
          if gh release view "$OLD_RELEASE_TAG" >/dev/null 2>&1; then
            OLD_VERSION="$(gh release view "$OLD_RELEASE_TAG" --json body --jq '.body' | grep -m 1 -E 'Most feltöltött alkalmazás verziója|Az alkalmazás belső verziója|Aktuális build verziója' | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
            OLD_ASSET_DATE="$(gh release view "$OLD_RELEASE_TAG" --json assets --jq '.assets[] | select(.name == "'"$IPK_FILE_NAME"'") | .updatedAt' | head -n 1)"
            if [[ -n "$OLD_ASSET_DATE" ]]; then
              OLD_RELEASE_DATETIME="$(TZ=Europe/Dublin date -d "$OLD_ASSET_DATE" '+%Y-%m-%d %H:%M %Z (Írország)')"
            fi
          fi
          [[ -n "$OLD_VERSION" ]] || OLD_VERSION="ismeretlen"

          RELEASE_DATETIME="$(TZ=Europe/Dublin date '+%Y-%m-%d %H:%M %Z (Írország)')"
          LOCAL_SHA="$(sha256sum "webos/$IPK_FILE_NAME" | awk '{print $1}')"

          # A Release neve az alkalmazás tényleges verziója lesz, nem a régi v2.3.1.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TITLE – LG webOS TV v$CURRENT_VERSION" --notes "LG webOS TV IPK kiadás."
          fi
          gh release upload "$RELEASE_TAG" "webos/$IPK_FILE_NAME" --clobber

          NEW_ASSET_DATE="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name == "'"$IPK_FILE_NAME"'") | .updatedAt' | head -n 1)"
          [[ -n "$NEW_ASSET_DATE" ]] || { echo "HIBA: nem található a feltöltött IPK időbélyege." >&2; exit 1; }
          RELEASE_UPDATED_DATETIME="$(TZ=Europe/Dublin date -d "$NEW_ASSET_DATE" '+%Y-%m-%d %H:%M %Z (Írország)')"

          sed \
            -e "s/{{RELEASE_DATETIME}}/$RELEASE_DATETIME/g" \
            -e "s/{{RELEASE_UPDATED_DATETIME}}/$RELEASE_UPDATED_DATETIME/g" \
            -e "s/{{CURRENT_VERSION}}/$CURRENT_VERSION/g" \
            -e "s/{{PREVIOUS_VERSION}}/$OLD_VERSION/g" \
            -e "s/{{PREVIOUS_DATETIME}}/$OLD_RELEASE_DATETIME/g" \
            release-notes.md > /tmp/release-notes.md
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE – LG webOS TV v$CURRENT_VERSION" --notes-file /tmp/release-notes.md

          # Csak az egyetlen IPK maradhat a Release-ben.
          while IFS= read -r asset; do
            [[ -z "$asset" || "$asset" == "$IPK_FILE_NAME" ]] && continue
            gh release delete-asset "$RELEASE_TAG" "$asset" --yes
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')

          REMOTE_SHA="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.name == "'"$IPK_FILE_NAME"'") | .digest' | sed 's/^sha256://')"
          [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" == "$LOCAL_SHA" ]] || {
            echo "HIBA: a Release-ben lévő IPK nem egyezik a most épített fájllal." >&2
            echo "Helyi SHA256: $LOCAL_SHA / Release SHA256: $REMOTE_SHA" >&2
            exit 1
          }
          ASSET_COUNT="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length')"
          [[ "$ASSET_COUNT" == "1" ]] || {
            echo "HIBA: a Release-ben $ASSET_COUNT fájl van; pontosan 1 IPK kell." >&2
            exit 1
          }

          # A régi, félrevezető v2.3.1 Release és Git-tag eltávolítása csak az új IPK ellenőrzése után.
          if [[ "$OLD_RELEASE_TAG" != "$RELEASE_TAG" ]] && gh release view "$OLD_RELEASE_TAG" >/dev/null 2>&1; then
            gh release delete "$OLD_RELEASE_TAG" --yes --cleanup-tag
          fi
          echo "OK: $IPK_FILE_NAME v$CURRENT_VERSION feltöltve; SHA-256 egyezik; ír helyi idő; előző verzió: $OLD_VERSION ($OLD_RELEASE_DATETIME)."
