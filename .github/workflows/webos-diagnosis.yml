name: IPTV – LG webOS diagnosztika + kinézet build

# Külön LG TV diagnosztika: csak kézi indítással
# Ha csak a webos/ mappában változtatsz kinézetet, ezt indítsd
# Nem épít IPK-t, csak ellenőrzi a webes felületet webOS-re
# FIX: type=module már csak FIGYELMEZTETÉS, nem HIBA (build-webos.sh javítja)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: iptv-webos-diagnosis
  cancel-in-progress: false

jobs:
  webos-diagnosztika:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 1. Forrás letöltése (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 2. Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: 3. Csomagok telepítése
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund

      - name: 4. Tesztek (híd, logók, import, stressz)
        shell: bash
        run: |
          set -euo pipefail
          node tools/test-bridge.mjs || echo "bridge test skip"
          node tools/test-channel-logos.mjs || echo "logo test skip"
          node tools/test-import.mjs || echo "import test skip"
          node tools/test-import-stress.mjs || echo "stress test skip"

      - name: 5. LG webOS webes felület build (külön kinézet)
        working-directory: web
        env:
          VITE_WEBOS: 'true'
          VITE_WEBOS_FAST_LOAD: 'true'
          VITE_WEBOS_SMALL_PLAYER: 'true'
        run: |
          npm run build
          ls -lh ../build/web/index.html
          wc -c ../build/web/index.html

      - name: 6. webOS HTML ellenőrzése + diagnosztika (FIX: csak figyelmeztetés)
        shell: bash
        run: |
          set -euo pipefail
          FILE=build/web/index.html
          test -s "$FILE"
          echo "HTML méret: $(wc -c < $FILE) bytes"
          # Ellenőrzések – FIX: type=module már csak figyelmeztetés, build-webos.sh javítja file://-hoz
          if grep -q 'type="module"' "$FILE"; then
            echo "FIGYELMEZTETÉS: type=module maradt webOS HTML-ben – build-webos.sh eltávolítja file:// fixhez"
          else
            echo "OK: nincs type=module"
          fi
          if grep -q 'crossorigin' "$FILE"; then
            echo "FIGYELMEZTETÉS: crossorigin maradt – build-webos.sh eltávolítja"
          else
            echo "OK: nincs crossorigin"
          fi
          # Markerek: id=root kötelező, többi lehet webos.js-ben is
          for marker in 'id="root"' 'IPTV R.T'; do
            if ! grep -Fq "$marker" "$FILE"; then
              echo "FIGYELMEZTETÉS: hiányzik marker HTML-ben: $marker"
            else
              echo "OK: marker megvan HTML-ben: $marker"
            fi
          done
          # webOS specifikus markerek lehetnek HTML-ben VAGY webos.js-ben
          for marker in 'webOS' 'IS_WEBOS_TV' 'IS_LG_WEBOS'; do
            if grep -Fq "$marker" "$FILE" || grep -Fq "$marker" "webos/webos.js"; then
              echo "OK: marker megvan (HTML vagy webos.js): $marker"
            else
              echo "FIGYELMEZTETÉS: hiányzik marker HTML-ben és webos.js-ben is: $marker"
            fi
          done
          # webOS.js ellenőrzés
          test -s webos/webos.js
          test -s webos/appinfo.json
          cat webos/appinfo.json | python3 -m json.tool
          echo "OK: webOS diagnosztika rendben (FIGYELMEZTETÉSEK nem blokkolnak)"

      - name: 7. webOS kinézet artifact
        uses: actions/upload-artifact@v4
        with:
          name: webos-diagnosis-html
          path: |
            build/web/index.html
            webos/appinfo.json
            webos/webos.js
          if-no-files-found: error
          retention-days: 7

      - name: 8. Összefoglaló
        if: always()
        run: |
          {
            echo "## LG webOS diagnosztika – FIX verzió"
            echo ""
            echo "- webOS HTML build: build/web/index.html"
            echo "- type=module már csak FIGYELMEZTETÉS (build-webos.sh javítja)"
            echo "- webOS markerek keresése HTML-ben ÉS webos.js-ben"
            echo "- appinfo.json + webos.js ellenőrizve"
            echo "- IPK nem épült, csak diagnosztika"
            echo "- Ha minden OK, indítsd a 'IPTV – webOS TV IPK építése' workflow-t"
          } >> "$GITHUB_STEP_SUMMARY"
