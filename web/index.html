<!doctype html>
<html lang="hu" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080d1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="IPTV R.T - Villámgyors Xtream Codes és M3U IPTV lejátszó Mozi és Sorozat támogatással, több hangsávval és 4-es nézettel." />
    <title>IPTV R.T - Prémium IPTV Lejátszó</title>
    <!-- Google Fonts. Aszinkron töltés: a külső stíluslap nem blokkolhatja az
         első kirajzolást, mert hálózat nélkül (vagy lassú DNS-sel)
         a felület addig üres/fekete képet mutatna. Ha nem érhető el, a rendszer
         betűtípusai érvényesülnek. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null;"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap"></noscript>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230072ff'/><polygon points='38,30 75,50 38,70' fill='%23ffcc00'/><text x='50' y='90' font-size='16' font-family='sans-serif' font-weight='900' fill='white' text-anchor='middle'>R.T</text></svg>" />
    <style>
      /* Smooth native scroll & touch */
      * {
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      input, textarea {
        user-select: text;
      }
      body {
        background-color: #080d1a;
        color: #f1f5f9;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 20, 40, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(56, 189, 248, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(56, 189, 248, 0.6);
      }
      /* Induló kép – csak sima CSS, hogy a Tailwind nélkül is működjön. */
      #boot-splash {
        display: none;
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 28px;
        text-align: center;
        background-color: #080d1a;
        color: #f1f5f9;
      }
      #boot-splash .boot-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.06em;
      }
      #boot-splash .boot-text {
        max-width: 320px;
        color: #94a3b8;
        font-size: 12px;
        line-height: 1.7;
      }
      #boot-splash .boot-stage {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        color: #38bdf8;
        min-height: 18px;
      }
      #boot-splash .boot-time {
        font-family: 'JetBrains Mono', monospace;
        font-size: 10px;
        color: #64748b;
      }
      #boot-splash .boot-error {
        max-width: 340px;
        color: #f87171;
        font-size: 11px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
      }
      #boot-splash .boot-spinner {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(56, 189, 248, 0.25);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: boot-spin 1s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-spinner {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="bg-[#080d1a] text-slate-100 min-h-screen antialiased select-none">
    <!--
      Induló kép a #root alatt: sima CSS, nem a Tailwind-os felület része. Ha a
      webes bundle bármiért nem fut le, akkor sem üres/fekete
      a képernyő, hanem ez a szöveg marad látható. A React az első renderrel
      törli ezt a tartalmat.
    -->
    <div id="root">
      <div id="boot-splash">
        <div class="boot-spinner"></div>
        <div class="boot-title">IPTV R.T</div>
        <div id="boot-stage" class="boot-stage">1/7 webOS HTML</div>
        <div id="boot-time" class="boot-time">0 ms</div>
        <div id="boot-error" class="boot-error"></div>
        <div class="boot-text">
          Az alkalmazás betöltése…
          <br />
          Ha ez az üzenet marad, a webes felület nem indult el. A pontos okot az
          alkalmazás a képernyő tetején lévő indítási naplóban írja ki.
        </div>
      </div>
    </div>
    <script>
      (function () {
        var started = Date.now();
        window.__IPTV_STARTUP_STAGE__ = 1;
        window.__IPTV_STARTUP_DIAG__ = true;

        function show(stage, label) {
          window.__IPTV_STARTUP_STAGE__ = stage;
          var el = document.getElementById('boot-stage');
          var tm = document.getElementById('boot-time');
          if (el) el.textContent = stage + '/7 ' + label;
          if (tm) tm.textContent = (Date.now() - started) + ' ms';
          try { console.log('STARTUP ' + stage + '/7 ' + label + ' @ ' + (Date.now() - started) + ' ms'); } catch (e) {}
        }

        window.__IPTV_STARTUP_STAGE_SET__ = show;

        window.__IPTV_STARTUP_FAIL__ = function (message) {
          var splash = document.getElementById('boot-splash');
          if (splash) splash.style.display = 'flex';
          var el = document.getElementById('boot-stage');
          var err = document.getElementById('boot-error');
          if (el) el.textContent = 'HIBA a(z) ' + (window.__IPTV_STARTUP_STAGE__ || '?') + '/7 lépésnél';
          if (err) err.textContent = String(message || 'Ismeretlen JavaScript hiba');
          try { console.error('STARTUP FAIL stage=' + window.__IPTV_STARTUP_STAGE__ + ': ' + String(message)); } catch (e) {}
        };

        show(1, 'webOS HTML');

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            show(2, 'DOM kész');
          }, { once: true });
        } else {
          show(2, 'DOM kész');
        }

        window.addEventListener('error', function (e) {
          window.__IPTV_STARTUP_FAIL__(
            'JS: ' + ((e && e.message) || e) + '\n' +
            ((e && e.filename) || '') + ':' + ((e && e.lineno) || 0)
          );
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          window.__IPTV_STARTUP_FAIL__(
            'Promise: ' + ((reason && reason.message) || String(reason))
          );
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
