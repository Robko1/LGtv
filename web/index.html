    <style>
      /* Smooth native scroll & touch */

      /* EGY PILLANAT ALATTI INDULÁS.
         Amíg a teljes főoldal (fejléc + csatornalista + lejátszó) fel nem épült,
         a képernyő a webOS indítóképét mutatja (ugyanaz a logó-képkocka), a
         #root pedig rejtve van. Így nincs "darabos" felépülés: a webOS
         töltőképe után EGYBEN jelenik meg a kész felület. A képet a HTML
         melletti splash-screen.png adja (a webOS csomagban ott van); ha nem
         érhető el, a logó színeihez illő átmenet látszik. A 7 mp-es
         biztonsági háló garantálja, hogy semmi ne maradjon rejtve. */
      /* A háttérkép (splash-bg.jpg) a build által készített fájl: a webOS
         indítóképével AZONOS kép. A url()-t szándékosan a szkript injektálja
         (a Vite a HTML CSS-ében fel akarná oldani). A statikus tartalék CSAK
         az átlagszín: a korábbi zöld színátmenet akkor villant be, amikor a
         beégetett kép dekódolása nem ért véget az első festésig (23:25:43). */
      html.iptv-booting body {
        /* A TAKARÓKÉP ALAPSZÍNE. A splash-screen.png mért átlagszíne
           (#6ccbd3, vízszintes-türkiz): korábban sötétkék (#0d1b2a) volt,
           így amíg a beégetett kép dekódolása tartott, egy SÖTÉT keret
           villant – az appinfo.json fekete bgColor-jával ez volt a
           „nagy gyors feketeség villanás”. Most a késleltetett keret is a
           takarókép színével egyezik, így nincs látható váltás. */
        background-color: #6ccbd3;
        background-image: none;
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
      }
      html.iptv-booting #root {
        visibility: hidden;
      }
      /*
       * KÉTLÉPCSŐS MEGJELENÉS – NINCS TÖBB FELVILLANÁS (2.5.131).
       *
       * A 22:32:49-es naplóban a takarókép +2770 ms-nál tűnt el, de a legnagyobb
       * tartalom csak +3602 ms-nál festődött ki; közte 600 ms-os főszál-leállás
       * volt (+3479 ms). Oka: a `visibility: hidden` miatt a böngésző a teljes
       * főoldalt CSAK a takarókép levétele után rasterizálta – a néző addig egy
       * üres/fekete képkockát látott. Ez volt az „egy nagy felvillanás”.
       *
       * Most a megjelenítés ELŐTT néhány képkockával az `iptv-prerender` osztály
       * láthatóvá teszi a #root-ot, de a TELJESEN ÁTLÁTSZATLAN #tv-curtain
       * (z-index 2147483000) még mindig eltakarja. A böngésző így a drága
       * 4K-s festést a takarókép ALATT, láthatatlanul végzi el; a REVEAL
       * pillanatában már csak egyetlen kompozitor-váltás történik.
       */
      html.iptv-prerender #root {
        visibility: visible;
      }
      /* NINCS BEÚSZÁS. A korábbi 140 ms-os áttűnés alatt a felület
         áttetsző volt, és alatta a takarékép háttér látszott – ez volt a
         "villogás" a rendszerindítás végén. A megjelenés mostantól
         egyetlen, azonnali váltás: a takarékép eltűnik, a kész felület
         ott van. */
      html.iptv-revealed #root {
        visibility: visible;
      }
      /* SAJÁT TAKARÉKÉP-RÉTEG.
         A webOS rendszerindító képe a notifyAppLoaded()-ig látszik; ez a
         réteg alatta UGYANAZT A KÉPET mutatja (a webOS indítóképének
         képkockáját: splash-bg.jpg, a logóval). Korábban csak a színátmenet
         volt itt, ezért látszott a rendszerindítás után egy üres ZÖLD
         képernyő a kész főoldal előtt. A képet a lentebbi szkript injektálja
         (a Vite feloldaná a HTML CSS-ében a url()-t); a színátmenet csak
         tartalék arra az esetre, ha a kép nem érhető el. */
      #tv-curtain {
        position: fixed;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        z-index: 2147483000;
        /* A TAKARÓKÉP ALAPSZÍNE. A splash-screen.png mért átlagszíne
           (#6ccbd3, vízszintes-türkiz): korábban sötétkék (#0d1b2a) volt,
           így amíg a beégetett kép dekódolása tartott, egy SÖTÉT keret
           villant – az appinfo.json fekete bgColor-jával ez volt a
           „nagy gyors feketeség villanás”. Most a késleltetett keret is a
           takarókép színével egyezik, így nincs látható váltás. */
        background-color: #6ccbd3;
        background-image: none;
        background-position: center center;
        background-size: cover;
        background-repeat: no-repeat;
        pointer-events: none;
      }
      html.iptv-revealed #tv-curtain {
        display: none;
      }
      /* INDULÓ VIDEÓ NINCS (2.5.0): a webOS saját indítóképernyője a logó
         képkockáját mutatja (splashBackground), utána azonnal a főoldal jön.
         Ez a blokk csak akkor látszik, ha az app indításkor valódi hibát ad. */
      #boot-error-screen {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: #080d1a;
        color: #f1f5f9;
        z-index: 2147483000;
      }
      #boot-error-screen.is-visible {
        display: flex;
      }
      #boot-error-screen .boot-stage {
        font-size: 22px;
        color: #64748b;
      }
      #boot-error-screen .boot-error {
        margin-top: 14px;
        max-width: 80vw;
        font-size: 20px;
        line-height: 1.5;
        color: #f87171;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
    <script>
      /*
       * TAKARÓKÉP HÁTTERÉNEK INJEKTÁLÁSA – SZIGORÚAN A <head>-BEN.
       *
       * A webOS indítóképével AZONOS kép a #tv-curtain rétegre és a body-ra
       * kerül, így a rendszerindítós után egyetlen váltás marad, és soha nem
       * látszik a tartalék színátmenet („zöld képernyő”).
       *
       * A KÉP BEÉGETVE (data URI): a build a splash-bg.jpg-t base64-ben írja
       * be a jelölő helyére (lásd a tools/build-webos.sh Python lépését).
       * FONTOS: a jelölőt máshol SZÓ SZERINT leírni TILOS (még megjegyzésben
       * sem), mert oda is bekerülne a 120 KB-os kép.
       */
      (function () {
        try {
          var bgStyle = document.createElement('style');
          var splashData = '__IPTV_SPLASH_DATA_URI__';
          var tinyData = '__IPTV_SPLASH_TINY_URI__';
          var hasSplash = !!splashData && splashData.indexOf('data:image/') === 0;
          var hasTiny = !!tinyData && tinyData.indexOf('data:image/') === 0;
          var splashImage = hasSplash ? 'url(' + splashData + ')' : "url('splash-bg.jpg')";
          /*
           * A TELJES KÉP DEKÓDOLÁSA MÁR A HTML FELDOLGOZÁSAKOR ELINDUL.
           * A CSS background-image dekódolása NEM tartja vissza az első
           * festést: a 23:25:43-es naplóban a first-paint 444 ms volt (előtte
           * 1029 ms), ezért a kép még nem volt kész, és a zöld tartalék
           * látszott. Egy rejtett Image + decode() több száz ms előnyt ad.
           */
          if (hasSplash) {
            try {
              var preload = new Image();
              preload.decoding = 'sync';
              preload.src = splashData;
              if (typeof preload.decode === 'function') {
                var pending = preload.decode();
                if (pending && typeof pending.then === 'function') {
                  pending.then(function () {}, function () {});
                }
              }
              // A referenciát szándékosan megtartjuk: a dekódolt bitmap így
              // nem eviktálódik, amíg a takarókép látszik (REVEAL-ig).
              window.__IPTV_SPLASH_PRELOAD__ = preload;
            } catch (e) {}
          }
          /*
           * NINCS TÖBB ZÖLD HÁTTÉR (2.5.133). A második réteg egy 48x27-es,
           * azonnal dekódolható (~2 kB), beégetett kicsinyített mása a VALÓDI
           * indítóképnek – nem egy zöld színátmenet. Az első festés tehát
           * rögtön a HELYES képet mutatja (csak homályosan); amint a teljes
           * JPEG megvan, az éles kép kerül fölé, egyetlen finom váltással.
           */
          var tinyImage = hasTiny ? 'url(' + tinyData + ')' : 'none';
          var splashLayer = splashImage + ',' + tinyImage;
          bgStyle.textContent =
            "html.iptv-booting body{background-image:" + splashLayer + ";" +
            "background-position:center center,center center;background-size:cover,cover;" +
            "background-repeat:no-repeat,no-repeat;}" +
            "#tv-curtain{background-image:" + splashLayer + ";" +
            "background-position:center center,center center;background-size:cover,cover;" +
            "background-repeat:no-repeat,no-repeat;}";
          (document.head || document.documentElement).appendChild(bgStyle);
        } catch (e) {}
      })();
    </script>

  <body class="bg-[#080d1a] text-slate-100 min-h-screen antialiased select-none">
    <!-- NINCS induló videó (2.5.0). A webOS saját indítóképernyője a logó
         képkockáját mutatja (appinfo.json: splashBackground), majd a program
         azonnal a főoldallal indul. Az itteni szkript csak az indulási
         lépés/hiba jelzéshez kell (a TV-n is olvasható hibaüzenet). -->
    <!-- A takarékép rétege: a kész felület megjelenéséig fedi a képernyőt. -->
    <div id="tv-curtain" aria-hidden="true"></div>
    <div id="root"></div>
    <div id="boot-error-screen">
      <div id="boot-stage" class="boot-stage"></div>
      <div id="boot-error" class="boot-error"></div>
    </div>
    <script>
      (function () {
        var started = Date.now();
        window.__IPTV_STARTUP_STAGE__ = 1;
        window.__IPTV_STARTUP_DIAG__ = true;

        /*
         * INDULÁSI JELZÉSEK – a TESZT IDŐSZAK diagnosztikájához.
         *
         * A naplózás az app bundle-je ELŐTT még nem létezik, ezért az itteni
         * korai lépések (webOS szkript, 1/7…7/7 fázisok, takarókép levétele,
         * erőforrás-hibák, JS-hibák) egy kis, legfeljebb 300 elemű pufferbe
         * kerülnek. Amikor a bundle elindítja a naplózást, a diagnosztika
         * ezeket időbélyeggel együtt átemeli a naplóba – így a napló a
         * legelső pillanattól teljes.
         *
         * A puffer csak akkor nő, ha a webOS szkript vagy ez a szkript fut;
         * a naplózás kikapcsolt állapotában semmilyen háttérmunka nem
         * történik vele.
         */
        var bootMarks = window.__IPTV_STARTUP_MARKS__ || (window.__IPTV_STARTUP_MARKS__ = []);
        if (!window.__IPTV_BOOT_EPOCH__) window.__IPTV_BOOT_EPOCH__ = started;
        function bootMark(label) {
          try {
            if (bootMarks.length >= 300) return;
            bootMarks.push({ at: Date.now(), label: String(label) });
          } catch (e) {}
        }
        window.__IPTV_BOOT_MARK__ = bootMark;
        bootMark('HTML induló szkript elindult');

        function byId(id) { return document.getElementById(id); }

        function show(stage, label) {
          window.__IPTV_STARTUP_STAGE__ = stage;
          var el = byId('boot-stage');
          if (el) el.textContent = stage + '/7 ' + label;
          bootMark('fázis ' + stage + '/7 – ' + label);
          try { console.log('STARTUP ' + stage + '/7 ' + label + ' @ ' + (Date.now() - started) + ' ms'); } catch (e) {}
        }
        window.__IPTV_STARTUP_STAGE_SET__ = show;

        // A webOS indítóképével AZONOS háttér (a build készíti: splash-bg.jpg).
        // FONTOS: a #tv-curtain rétegre is ezt tesszük, nem csak a body-ra.
        // A takarékép réteg fedi a body-t, ezért korábban csak a zöld
        // színátmenet látszott belőle – ez volt a "zöld üres képernyő" a
        // rendszerindítás után. Most a logós kép látszik egészen addig, amíg
        // a kész főoldal meg nem jelenik, egyetlen váltással.
        //
        // A KÉP BEÉGETVE (data URI): a build a splash-bg.jpg-t base64-ben
        // írja be a jelölő helyére (lásd a tools/build-webos.sh Python lépését;
        // a jelölőt ide SZÓ SZERINT leírni tilos, mert oda is bekerülne a kép).
        // Erre azért van szükség,
        // mert a külső fájl betöltése és dekódolása aszinkron: az első
        // kirajzolásnál még csak a zöld színátmenet volt a képernyőn, és a
        // kép csak utána „ugrott” a helyére – a webOS saját indítóképe után
        // ez a nézőnek úgy tűnt, mintha a takarókép össze-vissza ugrálna.
        // Beégetve a kép már az ELSŐ festésnél ott van, egyetlen váltás marad.
        // A TAKARÓKÉP HÁTTERÉT A <head>-BEN LÉVŐ SZKRIPT INJEKTÁLJA.
        // (Korábban ez itt, a <body>-ban volt: lassú TV-n a böngésző
        // még az injektálás ELŐTT kirajzolhatta a réteget, így egy
        // pillanatra csak a tartalék ZÖLD színátmenet látszott – ez volt
        // a „zöld háttér is bevillant”. A <head>-ben a stílus biztosan
        // az első festés előtt kerül a dokumentumba.)

        // ---------- Egy pillanat alatti megjelenés ----------
        // A #root addig rejtve van (a webOS indítókép látszik), amíg a
        // teljes főoldal fel nem épült. Ekkor EGYBEN jelenik meg.
        //
        // A webOS indítóképét a webOSSystem.notifyAppLoaded() hívás emeli le.
        // Ez a hívás UGYANEBBEN a feladatban fut, mint a megjelenítés: a
        // takarékép eltűnése és a kész főoldal megjelenése egyetlen
        // képernyőváltás. Ha a hívás később (vagy korábban) történne, a
        // képernyő villogna: egyszer a félkész felület, egyszer a kész.
        window.__IPTV_REVEALED__ = false;
        /*
         * ELŐFESTÉS A TAKARÓKÉP ALATT.
         *
         * A main.tsx ezt akkor hívja, amikor a főoldal DOM-ja már kész, de a
         * takarókép még fent van. A #root ilyenkor válik `visibility: visible`
         * elemmé, és a két animációs kép (afterPaint) már a VALÓDI felületet
         * festi ki – nem egy üres, rejtett fát. A #tv-curtain mindvégig fedi.
         * A visszafelé út nincs: ha a kód valamiért nem hívná meg, a REVEAL
         * maga is meghívja, így a #root soha nem marad rejtve.
         */
        window.__IPTV_PREPARED__ = false;
        window.__IPTV_PREPARE_REVEAL__ = function (fallback) {
          if (window.__IPTV_PREPARED__) return;
          window.__IPTV_PREPARED__ = true;
          try {
            var h = document.documentElement;
            if (!/\biptv-prerender\b/.test(h.className)) {
              h.className = (h.className + ' iptv-prerender')
                .replace(/\s+/g, ' ').replace(/^ | $/g, '');
            }
            // Szinkron elrendezés-kényszerítés: a festendő fa már készen álljon,
            // amikor a main.tsx két requestAnimationFrame-je elindul.
            var root = byId('root');
            if (root) { var forcedLayout = root.offsetHeight; }
            bootMark(fallback
              ? 'ELŐFESTÉS – csak a REVEAL pillanatában pótolva'
              : 'ELŐFESTÉS – a főoldal a takarókép alatt kifestve');
            /*
             * A KÉT KÉPKOCKÁT ITT, EGYSZER MÉRJÜK MEG – nem a REVEAL-ben.
             * A 23:25:43-es naplóban az előfestés után 167/183/217 ms-os
             * kihagyások voltak, és a revealWhenPainted() még két újabb
             * rAF-et várt: +639 ms (üres döntés) -> +933 ms (REVEAL).
             * Ha ez a jelző igaz, a felület már ki van festve, és a
             * megjelenítés AZONNAL megtörténhet.
             */
            window.__IPTV_PREPAINT_SETTLED__ = false;
            try {
              if (typeof window.requestAnimationFrame === 'function') {
                window.requestAnimationFrame(function () {
                  window.requestAnimationFrame(function () {
                    window.__IPTV_PREPAINT_SETTLED__ = true;
                    bootMark('ELŐFESTÉS KÉSZ – két képkocka a takarókép alatt');
                  });
                });
              } else {
                window.__IPTV_PREPAINT_SETTLED__ = true;
              }
            } catch (e) {
              window.__IPTV_PREPAINT_SETTLED__ = true;
            }
          } catch (e) {}
        };
        window.__IPTV_REVEAL__ = function (reason) {
          if (window.__IPTV_REVEALED__) return;
          window.__IPTV_REVEALED__ = true;
          try {
            // Biztonsági háló: ha az előfestés valamiért kimaradt, a #root
            // ekkor is láthatóvá válik, mielőtt a takaróképet levesszük.
            if (window.__IPTV_PREPARE_REVEAL__) window.__IPTV_PREPARE_REVEAL__(true);
            // A három művelet EGYETLEN feladatban fut, hogy a böngésző egy
            // festésben hajtsa végre őket: nincs félkész kép, nincs villanás.
            //   1) a saját takarékép-réteg eltűnik,
            //   2) a #root láthatóvá válik,
            //   3) a html osztály iptv-revealed lesz.
            var splash = document.getElementById('tv-curtain');
            if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
            var h = document.documentElement;
            h.className = h.className
              .replace(/\biptv-booting\b/, 'iptv-revealed')
              .replace(/\s+/g, ' ')
              .replace(/^ | $/g, '');
          } catch (e) {}
          // A platform indítóképe pontosan itt, a kész főoldal mellett
          // tűnik el – egyetlen váltás, nincs villanás.
          try {
            if (window.webOSSystem && typeof window.webOSSystem.notifyAppLoaded === 'function') {
              window.webOSSystem.notifyAppLoaded();
            }
          } catch (e) {}
          bootMark('REVEAL – a kész felület megjelent (' + (reason || '') + ')');
          try { console.log('REVEAL ' + (Date.now() - started) + ' ms (' + (reason || '') + ')'); } catch (e) {}
        };

        /*
         * Biztonsági háló: ha bármi elakad, akkor is megjelenik a felület
         * (soha nem maradhat rejtve a kép).
         *
         * FONTOS – EZ 12 MP, NEM 7: a főoldal saját döntése (main.tsx) legfeljebb
         * 9 másodpercet vár, és utána maga jeleníti meg a kész(nek tekintett)
         * felületet. Korábban ez a háló 7 másodpercnél sütött el, vagyis a
         * takarékép KORÁBBAN tűnt el, mint ahogy az alkalmazás befejezte volna
         * a főoldal építését: a néző előbb a félkész oldalt látta, aztán
         * sorban megérkeztek a sorok, az EPG és a logók – ez volt az
         * „össze-vissza ugráló takarókép”. A háló most szándékosan a
         * alkalmazás saját korlátja FELETT van, így normál esetben mindig az
         * alkalmazás dönt, a háló csak a valóban elakadt indítást menti meg.
         */
        window.setTimeout(function () {
          window.__IPTV_REVEAL__('biztonsági háló');
        }, 12000);

        function appReady() {
          return !!(window.__IPTV_APP_READY__ || (window.__IPTV_STARTUP_STAGE__ || 0) >= 7);
        }

        window.__IPTV_STARTUP_FAIL__ = function (message) {
          bootMark('INDULÁSI HIBA: ' + String(message).slice(0, 200));
          try { console.error('STARTUP FAIL stage=' + window.__IPTV_STARTUP_STAGE__ + ': ' + String(message)); } catch (e) {}
          var box = byId('boot-error-screen');
          if (!box) return;
          box.className = 'is-visible';
          try { window.__IPTV_REVEAL__ && window.__IPTV_REVEAL__('hiba'); } catch (e2) {}
          var el = byId('boot-stage');
          var err = byId('boot-error');
          if (el) el.textContent = 'HIBA a(z) ' + (window.__IPTV_STARTUP_STAGE__ || '?') + '/7 lépésnél';
          if (err) err.textContent = String(message || 'Ismeretlen JavaScript hiba');
        };

        // Erőforrás-betöltési hiba (betűtípus internet nélkül, logó stb.) NEM
        // apphiba - csak naplózzuk. Kész felület fölött semmi nem takarhatja el.
        function isResourceError(e) {
          var t = e && e.target;
          return !!(t && t !== window && t !== document && t.tagName);
        }

        window.addEventListener('error', function (e) {
          if (isResourceError(e)) {
            try {
              var t = e.target;
              bootMark('erőforrás nem töltődött be: ' + t.tagName +
                ' – ' + (t.src || t.href || t.currentSrc || ''));
              console.warn('STARTUP: erőforrás nem töltődött be: ' + t.tagName +
                ' – ' + (t.src || t.href || t.currentSrc || ''));
            } catch (e2) {}
            return;
          }
          if (!e || !e.message) return;
          if (appReady()) {
            try {
              bootMark('JS-hiba a felület futása közben: ' + e.message + ' @ ' +
                (e.filename || '') + ':' + (e.lineno || 0));
              console.error('IPTV-RT hiba (a felület már fut): ' + e.message + ' @ ' +
                (e.filename || '') + ':' + (e.lineno || 0));
            } catch (e2) {}
            return;
          }
          window.__IPTV_STARTUP_FAIL__('JS: ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || 0));
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          var message = (reason && (reason.stack || reason.message)) || String(reason);
          bootMark('kezeletlen ígérethiba: ' + String(message).slice(0, 200));
          if (appReady()) {
            try { console.error('IPTV-RT promise hiba (a felület már fut): ' + message); } catch (e2) {}
            return;
          }
          window.__IPTV_STARTUP_FAIL__('Promise: ' + message);
        });

        // A dokumentum további életciklus-lépései is jelzésként kerülnek a
        // naplóba – ezekből látszik, mennyi idő telt el a bundle indulásáig.
        try {
          document.addEventListener('DOMContentLoaded', function () {
            bootMark('DOM tartalom betöltve (DOMContentLoaded)');
          });
          window.addEventListener('load', function () {
            bootMark('minden erőforrás betöltve (load)');
          });
        } catch (e) {}

        show(1, 'webOS HTML');
        show(2, 'DOM kész');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
