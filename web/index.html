    <style>
      /* Smooth native scroll & touch */
      * {
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      input, textarea {
        user-select: text;
      }
      body {
        background-color: #080d1a;
        color: #f1f5f9;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 20, 40, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(56, 189, 248, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(56, 189, 248, 0.6);
      }
      /* INDULÓ VIDEÓ: teljes képernyős, fekvő bejelentkező animáció (nincs TV
         felirat). A React app közben a háttérben töltődik fel, így a videó
         végén a kép "összeáll": a videó elhalványul, és már a kész felület
         van mögötte. A videó nem kap görgetősávot és nem tolja el az appot. */
      #boot-splash {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
        z-index: 2147483000;
      }
      #boot-splash.is-hidden {
        opacity: 0;
        transition: opacity 0.55s ease-out;
        pointer-events: none;
      }
      /* A videó első kockája a videó MÖGÖTT, nagyon lassú nagyítással - így a
         várakozás (amíg a TV dekódere elindul) nem tűnik lefagyott képnek. */
      #boot-splash .boot-poster {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
        z-index: 0;
        animation: bootPosterZoom 10s linear forwards;
        transform-origin: 50% 50%;
      }
      @keyframes bootPosterZoom {
        from { transform: scale(1); }
        to { transform: scale(1.05); }
      }
      #boot-splash .boot-video {
        z-index: 1;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        /* A videó első kockája (plakát) a háttérben: a videó előtt is ez
           látszik, nem fekete/fehér villanás. */
        background: #000 url('assets/intro-poster.jpg') center center / contain no-repeat;
      }
      /* Indulási lépés + hibaüzenet: csak HIBA esetén látszik (a videó helyén),
         hogy a TV-n is olvasható legyen, mi akadt el. */
      #boot-splash .boot-hint {
        display: none;
      }
      #boot-splash.boot-failed .boot-video {
        display: none;
      }
      #boot-splash.boot-failed .boot-hint {
        display: flex;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: #080d1a;
        color: #f1f5f9;
      }
      #boot-splash .boot-stage {
        font-size: 22px;
        color: #64748b;
      }
      #boot-splash .boot-time {
        margin-top: 6px;
        font-size: 18px;
        color: #475569;
      }
      #boot-splash .boot-error {
        margin-top: 14px;
        max-width: 80vw;
        font-size: 20px;
        line-height: 1.5;
        color: #f87171;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
    <!-- Induló videó bootstrap: a <head>-ben, az alkalmazás előtt fut, hogy a
         videó azonnal elinduljon (a nagy app-csomag elemzése közben). -->
    <script src="/intro-boot.js"></script>
  </head>
  <body class="bg-[#080d1a] text-slate-100 min-h-screen antialiased select-none">
    <!-- INDULÓ (BEJELENTKEZŐ) VIDEÓ.
         A teljes képernyős overlay-t (plakát + videó) a webos/intro-boot.js
         készíti el, és az a HTML <head>-jében, az ALKALMAZÁS ELŐTT fut - így a
         videó az első pillanatban elindul, a nagy app-csomag elemzése alatt.
         A #root-on KÍVÜL van, mert a React az első rajzoláskor lecseréli a
         #root teljes tartalmát. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
