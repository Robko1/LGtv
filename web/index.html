    <style>
      /* Smooth native scroll & touch */
      * {
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      input, textarea {
        user-select: text;
      }
      body {
        background-color: #080d1a;
        color: #f1f5f9;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 20, 40, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(56, 189, 248, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(56, 189, 248, 0.6);
      }
      /* INDULÓ VIDEÓ: teljes képernyős, fekvő bejelentkező animáció (nincs TV
         felirat). A React app közben a háttérben töltődik fel, így a videó
         végén a kép "összeáll": a videó elhalványul, és már a kész felület
         van mögötte. A videó nem kap görgetősávot és nem tolja el az appot. */
      #boot-splash {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #000;
        z-index: 99998;
      }
      #boot-splash.is-hidden {
        opacity: 0;
        transition: opacity 0.55s ease-out;
        pointer-events: none;
      }
      #boot-splash .boot-video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
      /* Indulási lépés + hibaüzenet: csak HIBA esetén látszik (a videó helyén),
         hogy a TV-n is olvasható legyen, mi akadt el. */
      #boot-splash .boot-hint {
        display: none;
      }
      #boot-splash.boot-failed .boot-video {
        display: none;
      }
      #boot-splash.boot-failed .boot-hint {
        display: flex;
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: #080d1a;
        color: #f1f5f9;
      }
      #boot-splash .boot-stage {
        font-size: 22px;
        color: #64748b;
      }
      #boot-splash .boot-time {
        margin-top: 6px;
        font-size: 18px;
        color: #475569;
      }
      #boot-splash .boot-error {
        margin-top: 14px;
        max-width: 80vw;
        font-size: 20px;
        line-height: 1.5;
        color: #f87171;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>

  <body class="bg-[#080d1a] text-slate-100 min-h-screen antialiased select-none">
    <!-- INDULÓ (BEJELENTKEZŐ) VIDEÓ.
         FONTOS: a #boot-splash a #root-on KÍVÜL van, mert a React a #root
         teljes tartalmát lecseréli az első rajzoláskor – a régi splash ezért
         eltűnt, mielőtt a videó végigmehetett volna. Így a videó az app
         FÖLÖTT fut, az app pedig közben a háttérben épül fel. -->
    <div id="boot-splash" aria-label="Induló videó">
      <video id="boot-video" class="boot-video" playsinline webkit-playsinline
        preload="auto" disablepictureinpicture x-webkit-airplay="deny"></video>
      <div id="boot-hint" class="boot-hint">
        <!-- A __IPTV_STARTUP_STAGE_SET__ / __IPTV_STARTUP_FAIL__ ide ír:
             korábban ezek az elemek hiányoztak, ezért az indulási hiba
             sosem látszott a TV képernyőjén. -->
        <div id="boot-stage" class="boot-stage"></div>
        <div id="boot-time" class="boot-time"></div>
        <div id="boot-error" class="boot-error"></div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var started = Date.now();
        window.__IPTV_STARTUP_STAGE__ = 1;
        window.__IPTV_STARTUP_DIAG__ = true;

        function byId(id) {
          return document.getElementById(id);
        }

        function show(stage, label) {
          window.__IPTV_STARTUP_STAGE__ = stage;
          var el = byId('boot-stage');
          var tm = byId('boot-time');
          if (el) el.textContent = stage + '/7 ' + label;
          if (tm) tm.textContent = (Date.now() - started) + ' ms';
          try { console.log('STARTUP ' + stage + '/7 ' + label + ' @ ' + (Date.now() - started) + ' ms'); } catch (e) {}
        }

        window.__IPTV_STARTUP_STAGE_SET__ = show;

        // ---------- INDULÓ VIDEÓ ----------
        // A videó a teljes képernyőn fut, alatta a React app már betölt.
        // A videó végén (vagy ha a TV nem tudja lejátszani) elhalványul, és
        // a háttérben addigra összeállt felület jelenik meg.
        var INTRO_SRC = 'assets/intro.mp4';
        var introEnded = false;

        // Rövid napló arról, MIÉRT tűnt el az induló videó. A PIROS gombos
        // TV diagnosztika kiírja (a TV-n nincs hozzáférésünk a konzolhoz),
        // így a "félbeszakadt a videó" típusú hibák oka látható lesz.
        var introLogEntries = [];
        window.__IPTV_INTRO_LOG__ = introLogEntries;
        function introLog(message) {
          try {
            introLogEntries.push(Math.round(Date.now() - started) + ' ms: ' + message);
            if (introLogEntries.length > 12) introLogEntries.shift();
            console.log('INTRO ' + message);
          } catch (e) {}
        }

        function removeSplash() {
          var splash = byId('boot-splash');
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }

        function endIntro(reason) {
          if (introEnded) return;
          introEnded = true;
          introLog('vége: ' + reason);
          var splash = byId('boot-splash');
          var video = byId('boot-video');
          if (video) {
            try { video.pause(); } catch (e) {}
          }
          if (!splash) return;
          if (splash.className.indexOf('boot-failed') >= 0) return; // hiba: marad a hibaüzenet
          splash.className += ' is-hidden';
          window.setTimeout(removeSplash, 650);
        }

        function startIntro() {
          var video = byId('boot-video');
          if (!video) { endIntro('nincs videó elem'); return; }
          try {
            video.addEventListener('ended', function () { endIntro('ended esemény'); });
            video.addEventListener('error', function () {
              var code = 'ismeretlen';
              try { code = video.error ? video.error.code : 'nincs error objektum'; } catch (e) {}
              endIntro('error esemény (code ' + code + ')');
            });
            video.addEventListener('playing', function () {
              introLog('lejátszás elindult (' + Math.round(video.currentTime * 100) / 100 + ' s)');
            });
            // Ha a TV a hangos autoplay-t tiltotta (ezért némán indult), próbáljuk
            // visszakapcsolni a hangot. Ha ettől megállna, visszanémítjuk.
            video.addEventListener('playing', function () {
              if (!video.muted) return;
              introLog('néma indult – hang visszakapcsolása');
              try { video.muted = false; video.volume = 1; } catch (e) {}
              window.setTimeout(function () {
                if (video.paused) {
                  introLog('a hang visszakapcsolása megállította – újra némán');
                  try { video.muted = true; video.play(); } catch (e) {}
                }
              }, 600);
            }, { once: true });
          } catch (e) {}

          try {
            video.src = INTRO_SRC;
            video.load();
          } catch (e) { endIntro('a videó betöltése nem indult el'); return; }

          // Hanggal indul (a logó-videó hangja); ha a TV motorja a hangos
          // automatikus indítást tiltja, némán újrapróbáljuk, hogy a videó
          // akkor is végigmenjen.
          try { video.muted = false; video.volume = 1; } catch (e) {}
          var played = null;
          try { played = video.play(); } catch (e) {}
          if (played && played.catch) {
            played.catch(function () {
              introLog('hangos indítás tiltva – néma újrapróbálás');
              try { video.muted = true; video.play(); } catch (e) {}
            });
          } else if (!played) {
            introLog('play() nem adott Promise-t (régi motor)');
          }

          // Ha 8 mp alatt el sem indul (nincs videófájl, tiltott autoplay,
          // nagyon lassú TV), akkor nem tartjuk tovább fogva a felületet.
          window.setTimeout(function () {
            var v = byId('boot-video');
            if (!v) return;
            if (v.currentTime > 0.05) return;
            // Ha már van dekódolt kép (readyState >= 2), csak lassan indul -
            // ilyenkor NEM tesszük el a videót, a megakadás-figyelő dönt.
            if (v.readyState >= 2) { introLog('8 mp után is lassan indul, de van kép – várunk'); return; }
            endIntro('8 mp alatt nem indult el (readyState ' + v.readyState + ')');
          }, 8000);

          // Ha a lejátszás tartósan megakad (nem halad a videó), engedjük el.
          // 10 másodperc türelmi idő: a TV a háttérben felépülő felülettől is
          // el tudja venni a processzort, ilyenkor rövid ideig állhat a kép.
          var lastTime = -1;
          var stuck = 0;
          var watchdog = window.setInterval(function () {
            var v = byId('boot-video');
            if (introEnded || !v) { window.clearInterval(watchdog); return; }
            if (!v.paused && v.currentTime > lastTime + 0.01) {
              lastTime = v.currentTime;
              stuck = 0;
              return;
            }
            stuck++;
            if (stuck >= 10) {
              window.clearInterval(watchdog);
              endIntro('megakadt (' + Math.round((v.currentTime || 0) * 10) / 10 + ' s-nál, paused=' + v.paused + ')');
            }
          }, 1000);
        }

        window.__IPTV_STARTUP_FAIL__ = function (message) {
          try { console.error('STARTUP FAIL stage=' + window.__IPTV_STARTUP_STAGE__ + ': ' + String(message)); } catch (e) {}

          var splash = byId('boot-splash');
          if (!splash) {
            // A videó már levéltük: külön hibaablak, hogy ne üres fekete kép legyen.
            splash = document.createElement('div');
            splash.id = 'boot-splash';
            splash.innerHTML = '<div class="boot-hint" style="display:flex">' +
              '<div id="boot-stage" class="boot-stage"></div>' +
              '<div id="boot-time" class="boot-time"></div>' +
              '<div id="boot-error" class="boot-error"></div></div>';
            if (document.body) document.body.appendChild(splash);
          }
          if (!splash) return;
          splash.className = 'boot-failed';
          introEnded = true;
          var video = byId('boot-video');
          if (video) {
            try { video.pause(); } catch (e) {}
            try { video.removeAttribute('src'); } catch (e) {}
          }
          var el = byId('boot-stage');
          var err = byId('boot-error');
          if (el) el.textContent = 'HIBA a(z) ' + (window.__IPTV_STARTUP_STAGE__ || '?') + '/7 lépésnél';
          if (err) err.textContent = String(message || 'Ismeretlen JavaScript hiba');
        };

        show(1, 'webOS HTML');

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            show(2, 'DOM kész');
            startIntro();
          }, { once: true });
        } else {
          show(2, 'DOM kész');
          startIntro();
        }

        // A felület akkor számít késznek, ha a React már kirajzolta a fejlécét
        // (main.tsx ilyenkor állítja be a __IPTV_APP_READY__ / 7. lépés jelzést).
        function appReady() {
          return !!(window.__IPTV_APP_READY__ || (window.__IPTV_STARTUP_STAGE__ || 0) >= 7);
        }

        // Az ERŐFORRÁS-betöltési hibák (betűtípus-stíluslap internet nélkül,
        // csatornalogó, induló videó stb.) is 'error' eseményként érkeznek a
        // window-ra, de NEM apphibák. Korábban ezek is előhozták a
        // "HIBA a(z) 7/7 lépésnél" képernyőt a már kész felület fölött
        // (az üzenet ilyenkor "JS:(object event)" volt).
        function isResourceError(e) {
          var t = e && e.target;
          return !!(t && t !== window && t !== document && t.tagName);
        }

        function resourceLabel(e) {
          try {
            var t = e.target;
            var src = t.src || t.href || t.currentSrc || '';
            return t.tagName + (src ? ' – ' + src : '');
          } catch (e2) { return 'ismeretlen erőforrás'; }
        }

        window.addEventListener('error', function (e) {
          if (isResourceError(e)) {
            // Csak naplózzuk (a PIROS gombos diagnosztika/konzol mutatja).
            try { console.warn('STARTUP: erőforrás nem töltődött be: ' + resourceLabel(e)); } catch (e2) {}
            return;
          }
          if (!e || !e.message) return; // ismeretlen esemény: ne takarjuk el a felületet
          if (appReady()) {
            // A felület már fut: a hibát naplózzuk, de NEM takarjuk el a képernyőt.
            try {
              console.error('IPTV-RT hiba (a felület már fut): ' + e.message + ' @ ' +
                (e.filename || '') + ':' + (e.lineno || 0));
            } catch (e2) {}
            return;
          }
          window.__IPTV_STARTUP_FAIL__(
            'JS: ' + e.message + '\n' + (e.filename || '') + ':' + (e.lineno || 0)
          );
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          var message = (reason && (reason.stack || reason.message)) || String(reason);
          if (appReady()) {
            try { console.error('IPTV-RT promise hiba (a felület már fut): ' + message); } catch (e2) {}
            return;
          }
          window.__IPTV_STARTUP_FAIL__('Promise: ' + message);
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
