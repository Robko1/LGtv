<!doctype html>
<html lang="hu" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080d1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="TV - Villámgyors Xtream Codes és M3U IPTV lejátszó Mozi és Sorozat támogatással, több hangsávval és 4-es nézettel." />
    <title>TV - Prémium IPTV Lejátszó</title>
    <!-- Google Fonts. Aszinkron töltés: a külső stíluslap nem blokkolhatja az
         első kirajzolást, mert hálózat nélkül (vagy lassú DNS-sel)
         a felület addig üres/fekete képet mutatna. Ha nem érhető el, a rendszer
         betűtípusai érvényesülnek. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null;"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap"></noscript>
    <link rel="icon" type="image/png" href="/ikonkep.png" />
    <style>
      /* Smooth native scroll & touch */
      * {
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      input, textarea {
        user-select: text;
      }
      body {
        background-color: #080d1a;
        color: #f1f5f9;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(10, 20, 40, 0.6);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(56, 189, 248, 0.3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(56, 189, 248, 0.6);
      }
      /* Egyszerű, fekvő webOS indulófelirat – videó, spinner és diagnosztikai szöveg nélkül. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: #000;
        color: #00BFFF;
        z-index: 99998;
      }
      #boot-splash .boot-title {
        font-size: clamp(64px, 8vw, 140px);
        font-weight: 800;
        letter-spacing: 0.08em;
      }
      /* Indulási lépés + hibaüzenet: a TV-n is látszik, ha az app elakad. */
      #boot-splash .boot-stage {
        margin-top: 20px;
        font-size: 22px;
        color: #64748b;
      }
      #boot-splash .boot-time {
        margin-top: 6px;
        font-size: 18px;
        color: #475569;
      }
      #boot-splash .boot-error {
        margin-top: 14px;
        max-width: 80vw;
        font-size: 20px;
        line-height: 1.5;
        color: #f87171;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body class="bg-[#080d1a] text-slate-100 min-h-screen antialiased select-none">
    <!-- Ha a React még nem rajzolt ki, csak a nagy TV felirat látszik. -->
    <div id="root">
      <div id="boot-splash" aria-label="TV indulás">
        <div style="display:flex;flex-direction:column;align-items:center;">
          <div class="boot-title">TV</div>
          <!-- A __IPTV_STARTUP_STAGE_SET__ / __IPTV_STARTUP_FAIL__ ide ír:
               korábban ezek az elemek hiányoztak, ezért az indulási hiba
               sosem látszott a TV képernyőjén. -->
          <div id="boot-stage" class="boot-stage"></div>
          <div id="boot-time" class="boot-time"></div>
          <div id="boot-error" class="boot-error"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var started = Date.now();
        window.__IPTV_STARTUP_STAGE__ = 1;
        window.__IPTV_STARTUP_DIAG__ = true;

        function show(stage, label) {
          window.__IPTV_STARTUP_STAGE__ = stage;
          var el = document.getElementById('boot-stage');
          var tm = document.getElementById('boot-time');
          if (el) el.textContent = stage + '/7 ' + label;
          if (tm) tm.textContent = (Date.now() - started) + ' ms';
          try { console.log('STARTUP ' + stage + '/7 ' + label + ' @ ' + (Date.now() - started) + ' ms'); } catch (e) {}
        }

        window.__IPTV_STARTUP_STAGE_SET__ = show;

        window.__IPTV_STARTUP_FAIL__ = function (message) {
          var splash = document.getElementById('boot-splash');
          if (splash) splash.style.display = 'flex';
          var el = document.getElementById('boot-stage');
          var err = document.getElementById('boot-error');
          if (el) el.textContent = 'HIBA a(z) ' + (window.__IPTV_STARTUP_STAGE__ || '?') + '/7 lépésnél';
          if (err) err.textContent = String(message || 'Ismeretlen JavaScript hiba');
          try { console.error('STARTUP FAIL stage=' + window.__IPTV_STARTUP_STAGE__ + ': ' + String(message)); } catch (e) {}
        };

        show(1, 'webOS HTML');

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', function () {
            show(2, 'DOM kész');
          }, { once: true });
        } else {
          show(2, 'DOM kész');
        }

        window.addEventListener('error', function (e) {
          window.__IPTV_STARTUP_FAIL__(
            'JS: ' + ((e && e.message) || e) + '\n' +
            ((e && e.filename) || '') + ':' + ((e && e.lineno) || 0)
          );
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          var reason = e && e.reason;
          window.__IPTV_STARTUP_FAIL__(
            'Promise: ' + ((reason && reason.message) || String(reason))
          );
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
