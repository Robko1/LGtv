    <!-- A BETÖLTŐKÉPERNYŐNEK NINCS HÁTTÉRKÉPE (2.5.158).
         A korábbi 1920x1080-as fotó (161 kB JPEG, 8 MB dekódolt kép) a
         1 GB memóriás TV-n késleltette az első festést, és a naplóban látszó
         módon kétszer próbált meg beúszni. A háttér mostantól TISZTA CSS
         színátmenet: nincs letöltés, nincs dekódolás, nincs újrafestés. -->
    <style>
      * { -webkit-tap-highlight-color: transparent; user-select: none; }
      input, textarea { user-select: text; }
      body {
        background-color: #080d1a;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }

      /* ═══════════════════════════════════════════════════════════════════
         ÚJ BETÖLTŐKÉPERNYŐ (Inditas.html alapján).

         A háttér tiszta CSS színátmenet (nincs fotó, nincs képkérés).
         A százalék,
         a csatornaszám, a sávszélesség és a hátralévő idő KIZÁRÓLAG a futó
         alkalmazás által jelentett, tényleges adatokból kerül ide – amíg
         nincs ilyen adat, „—” áll a helyén. Nincs szimulált érték, nincs
         időzített automatikus befejezés és nincs demó-újraindítás.

         A réteg a kész főoldal fölött van, és a REVEAL pillanatában
         EGYETLEN képkockával tűnik el – nincs elhalványulás, nincs köztes
         félig áttetsző kocka. A főoldalt a main.tsx már ELŐZŐLEG kifestette
         a takarókép alatt (#root `iptv-prerender` alatt látható), ezért a
         váltás egyetlen kompozitor lépés, nem villanás.
         Az indulás ALATT a betöltőképernyőn folyamatos, kompozitor-oldali
         mozgás fut (forgó gyűrű, vonuló fénycsík, lüktető pont) – ez adja
         a „megy a program” érzést, miközben a háttérben töltés zajlik.
         ═══════════════════════════════════════════════════════════════ */
      /* A HÁTTÉRSZÍN SOHA NEM VILÁGOS (2.5.151).
         A 35–39. napló/használói észrevétel: a takarókép után – és
         csatornaváltásnál a főoldalon – VILÁGOS TÜRKIZ (teal) kocka villant
         be. Két forrása volt:
           • a webOS ablak háttere (appinfo.json bgColor: világos türkiz) –
             ez látszik minden olyan pillanatban, amikor a lap éppen nem
             festett (a head-szkript és az első festés között 1,6 mp volt
             ilyen!);
           • a html és a takarókép (#tv-curtain) alapszíne, ami szintén
             világos türkiz volt.
         Mostantól MINDEN alapszín a kész felület sötétje (#080d1a): ha
         bármelyik réteg egy pillanatra hiányzik, a néző sötétet lát, nem
         világos kék villanást. A REVEAL-nál továbbra sem váltunk színt. */
      html { background-color: #080d1a; }
      html.iptv-booting body { background-color: #080d1a !important; }
      html.iptv-revealed body { background-color: #080d1a !important; }
      html.iptv-booting #root { visibility: hidden; }
      html.iptv-prerender #root { visibility: visible; }
      html.iptv-revealed #root { visibility: visible; }

      /* ÜRES TELEPÍTÉS: a lejátszó doboza a kész felületen sem lehet fekete.
         A takarókép színeihez illeszkedő színátmenet + lejátszás jel, és
         NINCS későn dekódolódó háttérkép (az 4674 ms-os LCP oka az volt). */
      /* 2.5.165: a lejátszó alapja FEKETE – a korábbi türkiz színátmenet
         volt a „világoskék háttér” a csatornaváltás alatt. */
      html[data-iptv-boot="empty"] [data-player-poster] {
        background: #000 !important;
        display: flex !important; align-items: center; justify-content: center;
      }
      html[data-iptv-boot="empty"] [data-player-poster]::after {
        content: '▶'; font-size: 5rem; line-height: 1; color: #9fe8d6; opacity: .78;
      }

      .iptv-curtain {
        position: fixed; left: 0; top: 0; right: 0; bottom: 0;
        z-index: 2147483000;
        /* 2.5.151: a takarókép alapja is sötét – a boot screen saját háttere
           (#04141A) fölötte van, de ha az még nem festett, nem villan be kék. */
        background-color: #080d1a;
        pointer-events: none;
        opacity: 1;
        overflow: hidden;
        will-change: opacity;
      }
      /*
       * A VÁLTÁS EGYETLEN KÉPKOCKA (2.5.147).
       *
       * A 200 ms-es elhalványulás alatt a néző a félig áttetsző betöltőképernyő
       * MÖGÖTT látta a videó még fekete síkját: ez volt az „egy hatalmas fekete
       * kép felugrik”. Ezért a takarókép a REVEAL pillanatában AZONNAL
       * eltűnik (display:none, átmenet nélkül), a kész felület pedig már
       * előtte kifestődött alatta. Nincs köztes képkocka, nincs villanás.
       */
      #tv-curtain.iptv-fading {
        opacity: 0 !important;
        display: none !important;
        -webkit-transition: none !important;
        transition: none !important;
      }

      /* ═══════════════════════════════════════════════════════════════════
         BETÖLTŐKÉPERNYŐ = A FELHASZNÁLÓ DIZÁJNJA (index.html, 2.5.166).

         A 2.5.166-os TV-naplók (#32–#37) mérése: az indítóképernyő saját
         munkája volt a legnagyobb egyszeri tétel az indulásban – a
         folyamatos CSS-animációk, a vászon-részecske-hurok, a 72 rovátka és
         az 1 mp-es óra minden képkockában dolgoztak, miközben a főoldal épült.
         Ezért a látvány ÁLLÓ: háttér (sötétítve, telítve), háromrétegű fátyol,
         vignetta, 84 pixeles rács, középen a VALÓS százalék a gyűrűvel,
         közvetlenül alatta a töltősáv, majd a valós statisztikák. Nincs
         szemcse, pásztázás, fénylegyező, vászon, virágzás, óra és záró fátyol.

         A felhasználói követelmény (2.5.166): a képernyő közepén a
         százalékos diagnosztika és az alatta lévő töltősáv legyen a hangsúly,
         valós adatokból, folyamatosan, akadozás nélkül.

         A DIZÁJN VÁLTOZATLAN, az ADATOK a futó alkalmazásból jönnek
         (window.__IPTV_BOOT__): százalék, szakasz, csatornaszám, letöltött
         adat, sebesség, hátralévő idő, verzió. Amíg egy adat nem érkezett
         meg, „—” áll a helyén. Nincs szimulált érték, nincs Math.random és
         nincs automatikus újraindítás (a demó motorja NEM került át).

         Minden szabály a #boot-screen alá van zárva, ezért a főoldal
         Tailwind osztályaira (grid, bar, chip, stat, fill, step, mark…)
         nem hat. A régi webOS motorok (Chromium 38) miatt a CSS-változók
         fel vannak oldva, az `inset` helyett left/top/right/bottom áll, és
         minden `clamp()` előtt van egy sima érték.
         ═══════════════════════════════════════════════════════════════ */
      #boot-screen {
        position: absolute; left: 0; top: 0; right: 0; bottom: 0;
        overflow: hidden;
        background-color: #04141A;
        color: #EAFFF9;
        font-family: "Segoe UI", "SF Pro Display", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        cursor: default;
      }
      #boot-screen .bootbg {
        position: absolute; left: 0; top: 0; right: 0; bottom: 0;
        z-index: 0;
        /*
         * 2.5.166: A HÁTTÉR SZÍNÁTMENET, NEM FOTÓ.
         *
         * Ugyanaz a kompozíció, mint a platform indítóképé (`webos/splash-screen.png`):
         * sötét teál alap, középen halvány fény, alul-felül sötétedés. Így a
         * két kép EGYEZIK (nincs színváltás a platform kép levételekor), a
         * festése viszont néhány színátmenet – nincs 1920×1080-as fotó
         * felskálázás, nincs filter, nincs GPU-réteg a TV-n.
         * Az IPTV-ikon változatlanul ott van a fejlécben és a jobb alsó sarokban.
         */
        background-image:
          radial-gradient(58% 62% at 50% 44%, rgba(20,150,138,.42) 0%, rgba(10,80,84,.20) 42%, rgba(4,20,26,0) 72%),
          linear-gradient(180deg, #073B3E 0%, #04161C 52%, #08111F 100%);
      }
/* A .stage a teljes képernyő sötét alapja: a platform indítókép és a saját
   betöltőképernyő háttere ugyanebből a tónusból indul (#04141a). */
#boot-screen .stage{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;isolation:isolate;background-color:#04141a}

#boot-screen .scrim{
  position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;
  background:
    radial-gradient(120% 85% at 50% 42%, rgba(4,20,26,.10) 0%, rgba(4,20,26,.55) 46%, rgba(4,20,26,.90) 100%),
    linear-gradient(180deg, rgba(3,17,22,.86) 0%, rgba(3,17,22,.16) 26%, rgba(3,17,22,.20) 62%, rgba(3,17,22,.92) 100%),
    linear-gradient(100deg, rgba(6,44,46,.62) 0%, rgba(4,20,26,0) 55%);
}
#boot-screen .vig{position:absolute;left:0;top:0;right:0;bottom:0;z-index:2;box-shadow:inset 0 0 clamp(90px,18vw,320px) rgba(2,12,16,.95)}
#boot-screen .grid{
  position:absolute;left:0;top:0;right:0;bottom:0;z-index:3;opacity:.30;
  background-image:
    repeating-linear-gradient(90deg, rgba(143,182,180,.16) 0 1px, transparent 1px 84px),
    repeating-linear-gradient(0deg, rgba(143,182,180,.10) 0 1px, transparent 1px 84px);
  -webkit-mask-image:radial-gradient(120% 90% at 50% 50%, transparent 28%, #000 100%);
  mask-image:radial-gradient(120% 90% at 50% 50%, transparent 28%, #000 100%);
}
#boot-screen .ui{
  position:absolute;left:0;top:0;right:0;bottom:0;z-index:10;
  display:flex;flex-direction:column;justify-content:space-between;
  padding:20px 24px;padding:clamp(20px,3.4vh,54px) clamp(24px,4.2vw,86px);
}
#boot-screen .rule{height:1px;background:linear-gradient(90deg, rgba(126,240,210,.55), rgba(143,182,180,.16) 45%, rgba(143,182,180,0));}
#boot-screen .rule.btm{background:linear-gradient(90deg, rgba(143,182,180,0), rgba(143,182,180,.20) 55%, rgba(126,240,210,.5))}
#boot-screen .micro{
  font-size:9px;font-size:clamp(9px,.72vw,11px);letter-spacing:.34em;text-transform:uppercase;
  color:#8FB6B4;font-weight:600;
}
#boot-screen header{display:flex;flex-direction:column;gap:clamp(12px,1.6vh,20px)}
#boot-screen .headrow{display:flex;align-items:center;justify-content:space-between;gap:20px}
#boot-screen .brand{display:flex;align-items:center;gap:14px;min-width:0}
#boot-screen .mark{
  position:relative;overflow:hidden;
  width:44px;width:clamp(44px,3.4vw,62px);height:44px;height:clamp(44px,3.4vw,62px);flex:none;border-radius:22%;
  background:linear-gradient(150deg,#B9F7E1,#4FC7B4 45%,#0E7C74);
  display:grid;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px rgba(234,255,249,.38), 0 0 22px rgba(126,240,210,.35), 0 10px 26px rgba(4,20,26,.6), inset 0 1px 0 rgba(255,255,255,.7);
}
#boot-screen .mark{cursor:pointer}
#boot-screen .mark:hover{box-shadow:0 0 0 1px rgba(234,255,249,.6), 0 0 30px rgba(126,240,210,.6), 0 10px 26px rgba(4,20,26,.6)}
#boot-screen .mark::after{
  content:"+";position:absolute;right:-2px;bottom:-4px;
  font:700 13px/1 "Segoe UI","SF Pro Display",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;color:#04141A;
  background:#7FF0D2;width:15px;height:15px;border-radius:50%;
  display:grid;align-items:center;justify-content:center;opacity:.55;transition:opacity .3s ease;
}
#boot-screen .mark:hover::after{opacity:1}
@media (prefers-reduced-motion:reduce){
#boot-screen .mark::after{opacity:.75}
}

#boot-screen .wordmark{display:flex;flex-direction:column;line-height:1;gap:6px;min-width:0}
#boot-screen .wordmark b{
  font-size:17px;font-size:clamp(17px,1.5vw,25px);font-weight:700;letter-spacing:.42em;
  color:#EAFFF9;text-shadow:0 2px 14px rgba(4,20,26,.9);
}
#boot-screen .wordmark span{
  font-size:8px;font-size:clamp(8px,.62vw,10px);letter-spacing:.40em;text-transform:uppercase;
  color:#7FF0D2;opacity:.85;font-weight:600;
}
#boot-screen .headmeta{display:flex;align-items:center;gap:10px;gap:clamp(10px,1.4vw,22px);flex:none}
#boot-screen .chip{
  display:flex;align-items:center;gap:9px;
  padding:8px 14px;border:1px solid rgba(143,182,180,.30);
  background:linear-gradient(180deg, rgba(7,59,62,.55), rgba(4,20,26,.55));
  font-size:9px;font-size:clamp(9px,.68vw,11px);letter-spacing:.22em;text-transform:uppercase;color:#CFEDE6;font-weight:600;
}
#boot-screen .dot{width:7px;height:7px;border-radius:50%;background:#FFB23F}
#boot-screen main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:6px 0;padding:clamp(6px,1.4vh,18px) 0;
  gap:14px;gap:clamp(14px,2.2vh,30px);
}
#boot-screen .eyebrow,#boot-screen .dialrow,#boot-screen .meter{width:100%}
#boot-screen .eyebrow{display:flex;align-items:center;justify-content:center;gap:14px}
#boot-screen .eyebrow .bar-lite{width:40px;width:clamp(40px,5vw,90px);height:1px;background:#7FF0D2;opacity:.7}
/*
 * 2.5.166: a képernyő KÖZEPÉN a valós százalék, közvetlenül alatta a
 * töltősáv. A tárcsa és az állapotszöveg EGYMÁS ALATT, középre igazítva áll
 * (a dizájn elemei változatlanok, csak a folyamatos animációk tűntek el).
 */
#boot-screen .dialrow{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;gap:clamp(18px,2.4vh,34px);flex-wrap:nowrap}
#boot-screen .dial{
  position:relative;flex:none;
  width:184px;width:clamp(184px,26vmin,300px);height:184px;height:clamp(184px,26vmin,300px);
}
#boot-screen .dial svg{position:absolute;left:0;top:0;right:0;bottom:0;width:100%;height:100%;overflow:visible}
#boot-screen .ring-track{stroke:rgba(234,255,249,.13)}
#boot-screen .ring-fill{
  stroke:url(#gfill);stroke-linecap:round;
  transition:stroke-dashoffset .18s linear;
}
#boot-screen .readout{
  position:absolute;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
}
#boot-screen .pct{
  font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums;
  font-size:44px;font-size:clamp(44px,7.4vmin,88px);font-weight:600;letter-spacing:-.05em;
  line-height:.92;color:#EAFFF9;
  text-shadow:0 0 34px rgba(126,240,210,.55), 0 4px 22px rgba(4,20,26,.9);
}
#boot-screen .pct sup{font-size:.34em;font-weight:500;letter-spacing:0;vertical-align:super;margin-left:.1em;color:#7FF0D2}
#boot-screen .pct-lbl{font-size:8px;font-size:clamp(8px,.6vw,10px);letter-spacing:.40em;text-transform:uppercase;color:#8FB6B4;font-weight:600;margin-top:6px}
#boot-screen .statusblock{min-width:0;max-width:min(1100px,86vw);display:flex;flex-direction:column;align-items:center}
#boot-screen .step{
  font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,"Courier New",monospace;font-size:10px;font-size:clamp(10px,.78vw,12px);letter-spacing:.24em;
  color:#FFB23F;text-transform:uppercase;margin-bottom:10px;
}
#boot-screen #status{
  font-size:21px;font-size:clamp(21px,2.5vw,40px);font-weight:300;letter-spacing:-.015em;
  line-height:1.12;color:#EAFFF9;margin:0;
  text-shadow:0 3px 24px rgba(4,20,26,.95);
  min-height:1.15em;
}

#boot-screen .subline{
  margin-top:12px;font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,"Courier New",monospace;font-size:10px;font-size:clamp(10px,.78vw,12.5px);
  letter-spacing:.16em;color:#A9CFC9;text-transform:uppercase;
  display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;
}
#boot-screen .subline i{font-style:normal;color:rgba(143,182,180,.6)}
#boot-screen .meter{
  width:100%;max-width:min(1180px,84vw);margin:0 auto;
}
#boot-screen .meterhead{display:flex;align-items:flex-end;justify-content:center;gap:clamp(24px,4vw,64px);margin-top:10px}
#boot-screen .stats{display:flex;gap:14px;gap:clamp(14px,2.6vw,44px);flex-wrap:wrap}
#boot-screen .stat{display:flex;flex-direction:column;gap:5px}
#boot-screen .stat b{
  font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums;font-weight:600;
  font-size:13px;font-size:clamp(13px,1.15vw,19px);color:#EAFFF9;letter-spacing:.02em;
}
#boot-screen .stat span{font-size:8px;font-size:clamp(8px,.6vw,10px);letter-spacing:.28em;text-transform:uppercase;color:#8FB6B4;font-weight:600}
#boot-screen .eta{text-align:right}
#boot-screen .eta b{font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,"Courier New",monospace;font-variant-numeric:tabular-nums;font-size:13px;font-size:clamp(13px,1.15vw,19px);color:#7FF0D2;font-weight:600}
#boot-screen .bar{
  position:relative;height:12px;height:clamp(12px,1.35vh,18px);
  border:1px solid rgba(126,240,210,.28);
  background:linear-gradient(180deg, rgba(4,20,26,.72), rgba(7,59,62,.42));
  overflow:hidden;
}
#boot-screen .fill{
  position:absolute;left:0;top:0;bottom:0;width:0%;
  background:linear-gradient(90deg,#0E7C74 0%,#33C3AC 42%,#7FF0D2 78%,#EAFFF9 100%);
}
#boot-screen .segs{
  position:absolute;left:0;top:0;right:0;bottom:0;
  background:repeating-linear-gradient(90deg, rgba(3,16,20,.92) 0 3px, rgba(0,0,0,0) 3px 13px);
  mix-blend-mode:normal;
}

#boot-screen .scale{display:flex;justify-content:space-between;margin-top:9px}
#boot-screen .scale span{
  font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,"Courier New",monospace;font-size:8px;font-size:clamp(8px,.58vw,10px);letter-spacing:.2em;
  color:rgba(143,182,180,.75);
}
#boot-screen footer{display:flex;flex-direction:column;gap:clamp(10px,1.5vh,18px)}
#boot-screen .footrow{display:flex;align-items:flex-end;justify-content:space-between;gap:24px}
#boot-screen .tip{display:flex;align-items:center;gap:14px;min-width:0}
#boot-screen .tipkey{
  flex:none;padding:5px 9px;border:1px solid rgba(126,240,210,.45);color:#7FF0D2;
  font-size:8px;font-size:clamp(8px,.6vw,10px);letter-spacing:.24em;font-weight:700;
}
#boot-screen #tip{
  font-size:11px;font-size:clamp(11px,.95vw,15px);color:#CFEDE6;letter-spacing:.01em;
  text-shadow:0 2px 12px rgba(4,20,26,.9);
}
#boot-screen .build{
  font-family:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Consolas,"Courier New",monospace;font-size:9px;font-size:clamp(9px,.66vw,11px);letter-spacing:.16em;
  color:rgba(143,182,180,.8);text-align:right;text-transform:uppercase;white-space:nowrap;
  display:flex;flex-direction:column;align-items:flex-end;gap:6px;
}

@media (max-width:860px), (max-height:560px){
#boot-screen .dialrow{gap:20px}
#boot-screen #status{font-size:clamp(19px,3.4vw,30px)}
#boot-screen .stats .stat:nth-child(3){display:none}
#boot-screen .wordmark span{display:none}
}
@media (max-width:560px){
#boot-screen .headmeta .chip.hide-s{display:none}
#boot-screen .headmeta{gap:10px}
#boot-screen .build{display:none}
}
@media (prefers-reduced-motion:reduce){
#boot-screen *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.15s !important}
}

#boot-screen .mark::after{display:none}
#boot-screen .footrow{padding-right:calc(clamp(72px,6vw,116px) + 28px)}

      #boot-error-screen {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        display: none; flex-direction: column; align-items: center; justify-content: center;
        padding: 24px; text-align: center; background: #080d1a; color: #f1f5f9;

      }
      #boot-error-screen.is-visible { display: flex; }
      #boot-error-screen .boot-stage { font-size: 22px; color: #64748b; }
      #boot-error-screen .boot-error {
        margin-top: 14px; max-width: 80vw; font-size: 20px; line-height: 1.5;
        color: #f87171; white-space: pre-wrap; word-break: break-word;
      }
    
      /* TEMPORARY_NO_BOOT_ANIMATION:
         Ideiglenes tesztmód: a webOS saját splash PNG-je után nincs külön
         HTML betöltőképernyő, grafika, folyamatjelző vagy takaróréteg.
         A React főoldal azonnal látható; az alkalmazás betöltése a háttérben
         folytatódhat. A blokk eltávolításával visszaállítható a régi működés. */
      #boot-screen,
      #tv-curtain,
      .iptv-curtain { display: none !important; }
      html.iptv-booting #root,
      html.iptv-prerender #root,
      html.iptv-revealed #root { visibility: visible !important; }
      html.iptv-booting body,
      html.iptv-revealed body { background: #080d1a !important; }

    <script>
      /*
       * HANGZÁR AZ INDULÁS ALATT (2.5.147).
       *
       * A 24. TV-napló szerint az első csatorna 19:45:22,166-kor már
       * LEJÁTSZOTT, a betöltőképernyő viszont csak 19:45:26,049-kor tűnt el:
       * 3,3 másodpercig szólt a hang a takarókép ALATT. Ezért a lejátszó a
       * takarókép alatt NÉMÁN indul, és a hangot a REVEAL pillanata nyitja ki,
       * a kész felület első kirajzolt képkockája után.
       *
       * A jelzőt a legelső, app előtti szkript állítja be, hogy a lejátszó
       * mindenképpen lássa már az első play() hívás előtt.
       */
      window.__IPTV_AUDIO_GATE__ = true;
    </script>
    <script>
      /*
       * KORAI INDULÁSI JELZÉSEK + A BETÖLTŐKÉP ELŐMELEGÍTÉSE.
       *
       * A naplózás ilyenkor még nem létezik, ezért a legelső lépések egy kis
       * pufferbe kerülnek; a bundle naplója időbélyeggel együtt emeli át őket.
       * A kép előmelegítése a <head>-ben indul, hogy az ELSŐ festés már a
       * valódi takaróképet mutassa (nincs üres/flat kocka).
       * ES5: nincs nyíl-függvény, nincs template literal, nincs const/let.
       */
      (function () {
        try {
          window.__IPTV_STARTUP_STAGE__ = 1;
          window.__IPTV_STARTUP_DIAG__ = true;
          var started = Date.now();
          if (!window.__IPTV_BOOT_EPOCH__) window.__IPTV_BOOT_EPOCH__ = started;
          var marks = window.__IPTV_STARTUP_MARKS__;
          if (!marks) { marks = []; window.__IPTV_STARTUP_MARKS__ = marks; }
          if (typeof window.__IPTV_BOOT_MARK__ !== 'function') {
            window.__IPTV_BOOT_MARK__ = function (label) {
              try {
                if (marks.length >= 300) return;
                marks.push({ at: Date.now(), label: String(label) });
              } catch (e) {}
            };
          }
          window.__IPTV_BOOT_MARK__('HTML induló szkript elindult');

          document.documentElement.style.backgroundColor = '#080d1a';
        } catch (e) {}
      })();
    </script>
